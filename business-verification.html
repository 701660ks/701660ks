<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Business Verification</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
}

.container {
    max-width: 600px;
    margin: 20px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

h1 {
    margin-top: 0;
}

.subtitle {
    color: #666;
    line-height: 1.5;
}

.field {
    margin-bottom: 20px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input[type="text"],
textarea,
input[type="file"] {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.options {
    display: flex;
    gap: 10px;
}

.option {
    flex: 1;
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 10px;
}

.option.active {
    border-color: #198754;
    background: #f0fff5;
}

.option input {
    width: auto;
}

.option label {
    display: inline;
}

.hidden {
    display: none !important;
}

.error {
    color: #dc3545;
    font-size: 14px;
    margin-top: 6px;
}

#pageError {
    display: none;
    padding: 12px;
    margin-bottom: 20px;
    border-radius: 8px;
    background: #ffe8e8;
    color: #b00020;
}

.upload-box {
    padding: 15px;
    background: #fafafa;
    border: 1px solid #ddd;
    border-radius: 10px;
    margin-bottom: 15px;
}

small {
    display: block;
    color: #777;
    margin-top: 7px;
    line-height: 1.4;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #198754;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

button:disabled {
    background: #999;
}

.status {
    text-align: center;
    padding: 30px 10px;
}

.status-icon {
    font-size: 55px;
}

</style>

</head>

<body>


<div class="container">


<!-- =====================================================
     FORM
===================================================== -->

<div id="formBox">

<h1>Business Verification</h1>

<p class="subtitle">
Please provide your business information.
</p>


<div id="pageError"></div>


<!-- =====================================================
     GST / PAN
===================================================== -->

<div class="field">

<label>
Do you have GST?
</label>


<div class="options">


<div
    class="option active"
    id="gstBox"
>

<input
    type="radio"
    name="verificationType"
    id="gstRadio"
    value="GST"
    checked
>

<label for="gstRadio">
I have GST
</label>

</div>


<div
    class="option"
    id="panBox"
>

<input
    type="radio"
    name="verificationType"
    id="panRadio"
    value="PAN"
>

<label for="panRadio">
I don't have GST
</label>

</div>


</div>

</div>


<!-- =====================================================
     GST
===================================================== -->

<div
    id="gstSection"
    class="field"
>

<label for="gstNumber">
GST Number
</label>

<input
    type="text"
    id="gstNumber"
    maxlength="15"
    placeholder="Enter GST number"
>

<div
    id="gstError"
    class="error"
></div>

</div>


<!-- =====================================================
     PAN
===================================================== -->

<div
    id="panSection"
    class="hidden"
>


<div class="field">

<label for="panNumber">
PAN Number
</label>

<input
    type="text"
    id="panNumber"
    maxlength="10"
    placeholder="Enter PAN number"
>

<div
    id="panError"
    class="error"
></div>

</div>


<!-- PAN FRONT -->

<div class="upload-box">

<label for="panFront">
PAN Card Front Side
</label>

<input
    type="file"
    id="panFront"
    accept="image/jpeg,image/png,image/webp"
>

<small>
Upload front side. JPG, PNG or WEBP. Maximum 5 MB.
</small>

<div
    id="frontError"
    class="error"
></div>

</div>


<!-- PAN BACK -->

<div class="upload-box">

<label for="panBack">
PAN Card Back Side
</label>

<input
    type="file"
    id="panBack"
    accept="image/jpeg,image/png,image/webp"
>

<small>
Upload back side. JPG, PNG or WEBP. Maximum 5 MB.
</small>

<div
    id="backError"
    class="error"
></div>

</div>


</div>


<!-- =====================================================
     BUSINESS NAME
===================================================== -->

<div class="field">

<label for="businessName">
Business Name
</label>

<input
    type="text"
    id="businessName"
    placeholder="Enter business name"
>

</div>


<!-- =====================================================
     ADDRESS
===================================================== -->

<div class="field">

<label for="businessAddress">
Business Address
</label>

<textarea
    id="businessAddress"
    placeholder="Enter complete business address"
></textarea>

</div>


<!-- =====================================================
     BUTTON
===================================================== -->

<button
    id="submitButton"
    type="button"
>

Continue

</button>


</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div
    id="statusBox"
    class="status hidden"
>

<div
    id="statusIcon"
    class="status-icon"
>
✓
</div>

<h2 id="statusTitle">
Verification Submitted Successfully
</h2>

<p id="statusMessage">
Your business account is being verified.
</p>

</div>


</div>


<script>


/* =====================================================
   1. SUPABASE CONFIG
===================================================== */

/*
IMPORTANT:

Replace these two values.

Use your Supabase Project URL
and your public anon/publishable key.

DO NOT use service_role / secret key.
*/

const SUPABASE_URL =
    "YOUR_SUPABASE_PROJECT_URL";

const SUPABASE_KEY =
    "YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   2. ELEMENTS
===================================================== */

const gstRadio =
    document.getElementById("gstRadio");

const panRadio =
    document.getElementById("panRadio");

const gstBox =
    document.getElementById("gstBox");

const panBox =
    document.getElementById("panBox");

const gstSection =
    document.getElementById("gstSection");

const panSection =
    document.getElementById("panSection");

const gstNumber =
    document.getElementById("gstNumber");

const panNumber =
    document.getElementById("panNumber");

const panFront =
    document.getElementById("panFront");

const panBack =
    document.getElementById("panBack");

const businessName =
    document.getElementById("businessName");

const businessAddress =
    document.getElementById("businessAddress");

const submitButton =
    document.getElementById("submitButton");

const formBox =
    document.getElementById("formBox");

const statusBox =
    document.getElementById("statusBox");

const statusIcon =
    document.getElementById("statusIcon");

const statusTitle =
    document.getElementById("statusTitle");

const statusMessage =
    document.getElementById("statusMessage");

const pageError =
    document.getElementById("pageError");

const gstError =
    document.getElementById("gstError");

const panError =
    document.getElementById("panError");

const frontError =
    document.getElementById("frontError");

const backError =
    document.getElementById("backError");


/* =====================================================
   3. ERROR
===================================================== */

function showError(message) {

    pageError.textContent =
        message;

    pageError.style.display =
        "block";

}


/* =====================================================
   4. GST / PAN SWITCH
===================================================== */

function switchType() {

    pageError.style.display =
        "none";

    gstError.textContent =
        "";

    panError.textContent =
        "";

    frontError.textContent =
        "";

    backError.textContent =
        "";


    if (panRadio.checked) {

        /* PAN */

        gstSection.classList.add(
            "hidden"
        );

        panSection.classList.remove(
            "hidden"
        );

        gstBox.classList.remove(
            "active"
        );

        panBox.classList.add(
            "active"
        );

        gstNumber.value = "";

    } else {

        /* GST */

        gstSection.classList.remove(
            "hidden"
        );

        panSection.classList.add(
            "hidden"
        );

        gstBox.classList.add(
            "active"
        );

        panBox.classList.remove(
            "active"
        );

        panNumber.value = "";

        panFront.value = "";

        panBack.value = "";

    }

}


/* =====================================================
   5. RADIO EVENTS
===================================================== */

gstRadio.addEventListener(
    "change",
    switchType
);

panRadio.addEventListener(
    "change",
    switchType
);


/* =====================================================
   6. INPUT FORMATTING
===================================================== */

gstNumber.addEventListener(
    "input",
    function() {

        this.value =
            this.value
            .toUpperCase()
            .replace(
                /[^A-Z0-9]/g,
                ""
            )
            .substring(
                0,
                15
            );

    }
);


panNumber.addEventListener(
    "input",
    function() {

        this.value =
            this.value
            .toUpperCase()
            .replace(
                /[^A-Z0-9]/g,
                ""
            )
            .substring(
                0,
                10
            );

    }
);


/* =====================================================
   7. GET USER
===================================================== */

async function getUser() {

    const result =
        await supabaseClient.auth.getUser();

    if (result.error) {

        console.error(
            result.error
        );

        return null;
    }

    return result.data.user;
}


/* =====================================================
   8. SHOW STATUS
===================================================== */

function showStatus(
    icon,
    title,
    message
) {

    formBox.classList.add(
        "hidden"
    );

    statusBox.classList.remove(
        "hidden"
    );

    statusIcon.textContent =
        icon;

    statusTitle.textContent =
        title;

    statusMessage.textContent =
        message;

}


/* =====================================================
   9. IMAGE VALIDATION
===================================================== */

function checkImage(file) {

    if (!file) {

        return "Please select an image.";

    }


    const allowed = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];


    if (
        !allowed.includes(
            file.type
        )
    ) {

        return "Only JPG, PNG or WEBP images are allowed.";

    }


    if (
        file.size >
        5 * 1024 * 1024
    ) {

        return "Image must be smaller than 5 MB.";

    }


    return null;

}


/* =====================================================
   10. UPLOAD IMAGE
===================================================== */

async function uploadImage(
    file,
    userId,
    side
) {

    const extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
        Date.now() +
        "_" +
        side +
        "." +
        extension;


    const path =
        "pan/" +
        userId +
        "/" +
        fileName;


    const result =
        await supabaseClient
        .storage
        .from("pan-documents")
        .upload(
            path,
            file,
            {
                upsert: false
            }
        );


    if (result.error) {

        throw result.error;

    }


    return path;

}


/* =====================================================
   11. SUBMIT
===================================================== */

submitButton.addEventListener(
    "click",
    async function() {


        /* Clear messages */

        pageError.style.display =
            "none";

        gstError.textContent =
            "";

        panError.textContent =
            "";

        frontError.textContent =
            "";

        backError.textContent =
            "";


        submitButton.disabled =
            true;

        submitButton.textContent =
            "Please wait...";


        let frontPath =
            null;

        let backPath =
            null;


        try {


            /* =============================================
               USER
            ============================================== */

            const user =
                await getUser();


            if (!user) {

                showError(
                    "Please login first."
                );

                return;

            }


            /* =============================================
               TYPE
            ============================================== */

            const type =
                panRadio.checked
                    ? "PAN"
                    : "GST";


            /* =============================================
               GST
            ============================================== */

            const gst =
                gstNumber.value
                .trim()
                .toUpperCase();


            if (
                type === "GST"
            ) {


                const gstPattern =
                    /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;


                if (
                    !gstPattern.test(
                        gst
                    )
                ) {

                    gstError.textContent =
                        "Enter a valid 15-character GST number.";

                    return;

                }

            }


            /* =============================================
               PAN
            ============================================== */

            const pan =
                panNumber.value
                .trim()
                .toUpperCase();


            if (
                type === "PAN"
            ) {


                const panPattern =
                    /^[A-Z]{5}[0-9]{4}[A-Z]$/;


                if (
                    !panPattern.test(
                        pan
                    )
                ) {

                    panError.textContent =
                        "Enter a valid 10-character PAN number.";

                    return;

                }


                /* FRONT */

                const frontMessage =
                    checkImage(
                        panFront.files[0]
                    );


                if (frontMessage) {

                    frontError.textContent =
                        frontMessage;

                    return;

                }


                /* BACK */

                const backMessage =
                    checkImage(
                        panBack.files[0]
                    );


                if (backMessage) {

                    backError.textContent =
                        backMessage;

                    return;

                }

            }


            /* =============================================
               BUSINESS
            ============================================== */

            const name =
                businessName.value.trim();


            const address =
                businessAddress.value.trim();


            if (!name) {

                showError(
                    "Please enter business name."
                );

                return;

            }


            if (!address) {

                showError(
                    "Please enter business address."
                );

                return;

            }


            /* =============================================
               UPLOAD PAN
            ============================================== */

            if (
                type === "PAN"
            ) {


                submitButton.textContent =
                    "Uploading front image...";


                frontPath =
                    await uploadImage(
                        panFront.files[0],
                        user.id,
                        "front"
                    );


                submitButton.textContent =
                    "Uploading back image...";


                backPath =
                    await uploadImage(
                        panBack.files[0],
                        user.id,
                        "back"
                    );

            }


            /* =============================================
               DATABASE
            ============================================== */

            submitButton.textContent =
                "Saving...";


            const record = {

                user_id:
                    user.id,

                verification_type:
                    type,

                gst_number:
                    type === "GST"
                        ? gst
                        : null,

                pan_number:
                    type === "PAN"
                        ? pan
                        : null,

                pan_front_path:
                    frontPath,

                pan_back_path:
                    backPath,

                business_name:
                    name,

                business_address:
                    address,

                status:
                    "pending"

            };


            const result =
                await supabaseClient
                .from(
                    "business_verifications"
                )
                .insert(
                    record
                );


            if (result.error) {

                console.error(
                    result.error
                );

                showError(
                    result.error.message
                );

                return;

            }


            /* =============================================
               SUCCESS
            ============================================== */

            showStatus(
                "✓",
                "Verification Submitted Successfully",
                "Your business account is being verified."
            );


        } catch (error) {


            console.error(
                "ERROR:",
                error
            );


            showError(
                error.message ||
                "Something went wrong."
            );


        } finally {


            submitButton.disabled =
                false;

            submitButton.textContent =
                "Continue";

        }

    }
);


/* =====================================================
   12. INITIAL
===================================================== */

switchType();


</script>

</body>

</html>
