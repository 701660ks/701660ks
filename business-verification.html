<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Verification</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label.title {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"],
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
            background: white;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .verification-options {
            display: flex;
            gap: 12px;
        }

        .verification-option {
            flex: 1;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
        }

        .verification-option.selected {
            border-color: #198754;
            background: #f0fff5;
        }

        .verification-option input {
            margin-right: 8px;
        }

        .hidden {
            display: none !important;
        }

        .upload-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .upload-card label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .help {
            font-size: 13px;
            color: #777;
            margin-top: 7px;
        }

        .error {
            color: #d93025;
            font-size: 14px;
            margin-top: 7px;
        }

        .main-error {
            display: none;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: #ffecec;
            color: #b00020;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 9px;
            padding: 15px;
            font-size: 17px;
            font-weight: bold;
            color: white;
            background: #198754;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .success {
            text-align: center;
            padding: 35px 10px;
        }

        .success-icon {
            font-size: 60px;
            color: #198754;
        }

        .success h2 {
            margin-bottom: 10px;
        }

        .debug {
            margin-top: 20px;
            padding: 10px;
            font-size: 12px;
            color: #666;
            background: #f7f7f7;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- ==================================================
         FORM
    =================================================== -->

    <div id="verificationForm">

        <h1>Business Verification</h1>

        <p class="description">
            Please provide your business details for verification.
        </p>

        <div id="mainError" class="main-error"></div>


        <!-- ==================================================
             GST / PAN SELECTION
        =================================================== -->
<div class="field">

    <label class="title">
        Do you have GST?
    </label>

    <div class="verification-options">

        <label
            class="verification-option selected"
            id="gstOption"
        >
            <input
                type="radio"
                name="verificationType"
                value="GST"
                checked
                onchange="changeVerificationType('GST')"
            >

            I have GST
        </label>


        <label
            class="verification-option"
            id="panOption"
        >
            <input
                type="radio"
                name="verificationType"
                value="PAN"
                onchange="changeVerificationType('PAN')"
            >

            I don't have GST
        </label>

    </div>

</div>





<!-- PAN -->

<div
    id="panSection"
    style="display:none;"
>

    <div class="field">

        <label class="title">
            PAN Number
        </label>

        <input
            type="text"
            id="panNumber"
            maxlength="10"
            placeholder="Enter PAN number"
        >

    </div>


    <div class="upload-card">

        <label>
            PAN Card Front Side
        </label>

        <input
            type="file"
            id="panFront"
            accept="image/*"
        >

    </div>


    <div class="upload-card">

        <label>
            PAN Card Back Side
        </label>

        <input
            type="file"
            id="panBack"
            accept="image/*"
        >

    </div>

</div>
        
        <!-- ==================================================
             GST SECTION
        =================================================== -->

        <div id="gstSection">

            <div class="field">

                <label
                    class="title"
                    for="gstNumber"
                >
                    GST Number
                </label>

                <input
                    type="text"
                    id="gstNumber"
                    maxlength="15"
                    autocomplete="off"
                    placeholder="Enter 15 digit GST number"
                >

                <div
                    id="gstError"
                    class="error"
                ></div>

            </div>

        </div>


        <!-- ==================================================
             PAN SECTION
        =================================================== -->

        <div
            id="panSection"
            class="hidden"
        >

            <div class="field">

                <label
                    class="title"
                    for="panNumber"
                >
                    PAN Number
                </label>

                <input
                    type="text"
                    id="panNumber"
                    maxlength="10"
                    autocomplete="off"
                    placeholder="Enter PAN number"
                >

                <div
                    id="panError"
                    class="error"
                ></div>

            </div>


            <!-- PAN FRONT -->

            <div class="upload-card">

                <label for="panFront">
                    PAN Card Front Side
                </label>

                <input
                    type="file"
                    id="panFront"
                    accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
                >

                <div class="help">
                    JPG, PNG or WEBP. Maximum 5 MB.
                </div>

                <div
                    id="frontError"
                    class="error"
                ></div>

            </div>


            <!-- PAN BACK -->

            <div class="upload-card">

                <label for="panBack">
                    PAN Card Back Side
                </label>

                <input
                    type="file"
                    id="panBack"
                    accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
                >

                <div class="help">
                    JPG, PNG or WEBP. Maximum 5 MB.
                </div>

                <div
                    id="backError"
                    class="error"
                ></div>

            </div>

        </div>


        <!-- ==================================================
             BUSINESS NAME
        =================================================== -->

        <div class="field">

            <label
                class="title"
                for="businessName"
            >
                Business Name
            </label>

            <input
                type="text"
                id="businessName"
                placeholder="Enter business name"
            >

        </div>


        <!-- ==================================================
             BUSINESS ADDRESS
        =================================================== -->

        <div class="field">

            <label
                class="title"
                for="businessAddress"
            >
                Business Address
            </label>

            <textarea
                id="businessAddress"
                placeholder="Enter complete business address"
            ></textarea>

        </div>


        <!-- ==================================================
             SUBMIT
        =================================================== -->

        <button
            type="button"
            id="submitButton"
        >
            Submit Verification
        </button>


        <div
            id="debugMessage"
            class="debug"
        ></div>

    </div>


    <!-- ==================================================
         SUCCESS
    =================================================== -->

    <div
        id="successScreen"
        class="success hidden"
    >

        <div class="success-icon">
            ✓
        </div>

        <h2>
            Verification Submitted Successfully
        </h2>

        <p>
            Your business account is being verified.
        </p>

    </div>

</div>


<script>

/* =========================================================
   1. SUPABASE CONFIGURATION
   ========================================================= */

/*
   IMPORTANT:
   Put YOUR Supabase URL and YOUR public anon/publishable key.

   Do NOT put service_role/secret key here.
*/

const SUPABASE_URL =
    "YOUR_SUPABASE_PROJECT_URL";

const SUPABASE_ANON_KEY =
    "YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY";


/* =========================================================
   2. CREATE SUPABASE CLIENT
   ========================================================= */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   3. GET HTML ELEMENTS
   ========================================================= */

const gstRadio =
    document.getElementById("gstRadio");

const panRadio =
    document.getElementById("panRadio");

const gstOption =
    document.getElementById("gstOption");

const panOption =
    document.getElementById("panOption");

const gstSection =
    document.getElementById("gstSection");

const panSection =
    document.getElementById("panSection");

const gstNumber =
    document.getElementById("gstNumber");

const panNumber =
    document.getElementById("panNumber");

const panFront =
    document.getElementById("panFront");

const panBack =
    document.getElementById("panBack");

const businessName =
    document.getElementById("businessName");

const businessAddress =
    document.getElementById("businessAddress");

const submitButton =
    document.getElementById("submitButton");

const mainError =
    document.getElementById("mainError");

const gstError =
    document.getElementById("gstError");

const panError =
    document.getElementById("panError");

const frontError =
    document.getElementById("frontError");

const backError =
    document.getElementById("backError");

const verificationForm =
    document.getElementById("verificationForm");

const successScreen =
    document.getElementById("successScreen");


/* =========================================================
   4. SHOW ERROR
   ========================================================= */

function showMainError(message) {

    mainError.textContent =
        message;

    mainError.style.display =
        "block";

}


/* =========================================================
   5. CLEAR ERRORS
   ========================================================= */

function clearErrors() {

    mainError.textContent = "";

    mainError.style.display =
        "none";

    gstError.textContent = "";

    panError.textContent = "";

    frontError.textContent = "";

    backError.textContent = "";

}


/* =========================================================
   6. GST / PAN SWITCH
   ========================================================= */

function updateVerificationType() {

    clearErrors();


    if (panRadio.checked) {

        /* PAN SELECTED */

        gstSection.classList.add(
            "hidden"
        );

        panSection.classList.remove(
            "hidden"
        );

        gstOption.classList.remove(
            "selected"
        );

        panOption.classList.add(
            "selected"
        );

    } else {

        /* GST SELECTED */

        gstSection.classList.remove(
            "hidden"
        );

        panSection.classList.add(
            "hidden"
        );

        gstOption.classList.add(
            "selected"
        );

        panOption.classList.remove(
            "selected"
        );

    }

}


/* =========================================================
   7. RADIO EVENTS
   ========================================================= */

gstRadio.addEventListener(
    "change",
    updateVerificationType
);

panRadio.addEventListener(
    "change",
    updateVerificationType
);


/* =========================================================
   8. GST INPUT
   ========================================================= */

gstNumber.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .toUpperCase()
                .replace(
                    /[^A-Z0-9]/g,
                    ""
                )
                .slice(
                    0,
                    15
                );

    }
);


/* =========================================================
   9. PAN INPUT
   ========================================================= */

panNumber.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .toUpperCase()
                .replace(
                    /[^A-Z0-9]/g,
                    ""
                )
                .slice(
                    0,
                    10
                );

    }
);


/* =========================================================
   10. GET CURRENT USER
   ========================================================= */

async function getCurrentUser() {

    const {
        data,
        error
    } =
        await supabaseClient.auth.getUser();


    if (error) {

        console.error(
            "Auth error:",
            error
        );

        throw new Error(
            "Unable to check login."
        );

    }


    if (!data.user) {

        throw new Error(
            "Please login before submitting verification."
        );

    }


    return data.user;

}


/* =========================================================
   11. VALIDATE IMAGE
   ========================================================= */

function validateImage(
    file,
    side
) {

    if (!file) {

        return (
            "Please select PAN " +
            side +
            " image."
        );

    }


    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];


    if (
        !allowedTypes.includes(
            file.type
        )
    ) {

        return (
            "PAN " +
            side +
            " must be JPG, PNG or WEBP."
        );

    }


    if (
        file.size >
        5 * 1024 * 1024
    ) {

        return (
            "PAN " +
            side +
            " image must be less than 5 MB."
        );

    }


    return "";

}


/* =========================================================
   12. UPLOAD PAN IMAGE
   ========================================================= */

async function uploadPanImage(
    file,
    userId,
    side
) {

    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    const uniqueName =
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2, 10) +
        "_" +
        side +
        "." +
        extension;


    const filePath =
        "pan/" +
        userId +
        "/" +
        uniqueName;


    console.log(
        "Uploading:",
        filePath
    );


    const {
        data,
        error
    } =
        await supabaseClient
            .storage
            .from("pan-documents")
            .upload(
                filePath,
                file,
                {
                    cacheControl: "3600",
                    upsert: false,
                    contentType: file.type
                }
            );


    if (error) {

        console.error(
            "Storage error:",
            error
        );

        throw new Error(
            "PAN " +
            side +
            " upload failed: " +
            error.message
        );

    }


    console.log(
        "Upload successful:",
        data
    );


    return filePath;

}


/* =========================================================
   13. SUBMIT FORM
   ========================================================= */

submitButton.addEventListener(
    "click",
    submitVerification
);


/* =========================================================
   14. MAIN SUBMIT FUNCTION
   ========================================================= */

async function submitVerification() {

    clearErrors();


    submitButton.disabled =
        true;

    submitButton.textContent =
        "Please wait...";


    let frontPath = null;

    let backPath = null;


    try {


        /* ================================================
           GET USER
        ================================================= */

        const user =
            await getCurrentUser();


        console.log(
            "Logged in user:",
            user.id
        );


        /* ================================================
           GET TYPE
        ================================================= */

        const verificationType =
            panRadio.checked
                ? "PAN"
                : "GST";


        console.log(
            "Verification type:",
            verificationType
        );


        /* ================================================
           GET VALUES
        ================================================= */

        const gst =
            gstNumber.value
                .trim()
                .toUpperCase();


        const pan =
            panNumber.value
                .trim()
                .toUpperCase();


        const name =
            businessName.value
                .trim();


        const address =
            businessAddress.value
                .trim();


        /* ================================================
           BUSINESS VALIDATION
        ================================================= */

        if (!name) {

            showMainError(
                "Please enter your business name."
            );

            return;

        }


        if (!address) {

            showMainError(
                "Please enter your business address."
            );

            return;

        }

        /* =================================================
           GST VALIDATION
        ================================================== */

        if (verificationType === "GST") {

            const gstPattern =
                /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;

            if (!gstPattern.test(gst)) {

                gstError.textContent =
                    "Please enter a valid 15-character GST number.";

                return;
            }
        }


        /* =================================================
           PAN VALIDATION
        ================================================== */

        if (verificationType === "PAN") {

            const panPattern =
                /^[A-Z]{5}[0-9]{4}[A-Z]$/;

            if (!panPattern.test(pan)) {

                panError.textContent =
                    "Please enter a valid 10-character PAN number.";

                return;
            }


            /* =============================================
               PAN FRONT IMAGE
            ============================================== */

            const frontFile =
                panFront.files[0];

            if (!frontFile) {

                frontError.textContent =
                    "Please upload PAN front side.";

                return;
            }


            /* =============================================
               PAN BACK IMAGE
            ============================================== */

            const backFile =
                panBack.files[0];

            if (!backFile) {

                backError.textContent =
                    "Please upload PAN back side.";

                return;
            }


            /* =============================================
               CHECK FRONT IMAGE
            ============================================== */

            const allowedTypes = [
                "image/jpeg",
                "image/png",
                "image/webp"
            ];


            if (!allowedTypes.includes(frontFile.type)) {

                frontError.textContent =
                    "Front image must be JPG, PNG or WEBP.";

                return;
            }


            if (frontFile.size > 5 * 1024 * 1024) {

                frontError.textContent =
                    "Front image must be smaller than 5 MB.";

                return;
            }


            /* =============================================
               CHECK BACK IMAGE
            ============================================== */

            if (!allowedTypes.includes(backFile.type)) {

                backError.textContent =
                    "Back image must be JPG, PNG or WEBP.";

                return;
            }


            if (backFile.size > 5 * 1024 * 1024) {

                backError.textContent =
                    "Back image must be smaller than 5 MB.";

                return;
            }


            /* =============================================
               UPLOAD FRONT IMAGE
            ============================================== */

            submitButton.textContent =
                "Uploading PAN front...";


            const frontExtension =
                frontFile.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const frontPath =
                "pan/" +
                user.id +
                "/" +
                Date.now() +
                "_front." +
                frontExtension;


            const frontUpload =
                await supabaseClient
                    .storage
                    .from("pan-documents")
                    .upload(
                        frontPath,
                        frontFile,
                        {
                            upsert: false,
                            contentType: frontFile.type
                        }
                    );


            if (frontUpload.error) {

                throw new Error(
                    "PAN front upload failed: " +
                    frontUpload.error.message
                );
            }


            /* =============================================
               UPLOAD BACK IMAGE
            ============================================== */

            submitButton.textContent =
                "Uploading PAN back...";


            const backExtension =
                backFile.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const backPath =
                "pan/" +
                user.id +
                "/" +
                Date.now() +
                "_back." +
                backExtension;


            const backUpload =
                await supabaseClient
                    .storage
                    .from("pan-documents")
                    .upload(
                        backPath,
                        backFile,
                        {
                            upsert: false,
                            contentType: backFile.type
                        }
                    );


            if (backUpload.error) {

                throw new Error(
                    "PAN back upload failed: " +
                    backUpload.error.message
                );
            }


            /* SAVE PATHS */

            frontPathForDatabase =
                frontPath;

            backPathForDatabase =
                backPath;
        }


        /* =================================================
           SAVE DATABASE RECORD
        ================================================== */

        submitButton.textContent =
            "Saving verification...";


        const verificationData = {

            user_id: user.id,

            verification_type:
                verificationType,

            gst_number:
                verificationType === "GST"
                    ? gst
                    : null,

            pan_number:
                verificationType === "PAN"
                    ? pan
                    : null,

            pan_front_path:
                verificationType === "PAN"
                    ? frontPathForDatabase
                    : null,

            pan_back_path:
                verificationType === "PAN"
                    ? backPathForDatabase
                    : null,

            business_name:
                name,

            business_address:
                address,

            status:
                "pending"
        };


        const {
            data,
            error
        } =
            await supabaseClient
                .from("business_verifications")
                .insert(
                    verificationData
                )
                .select()
                .single();


        if (error) {

            console.error(
                "Supabase database error:",
                error
            );

            throw new Error(
                "Could not save verification: " +
                error.message
            );
        }


        /* =================================================
           SUCCESS
        ================================================== */

        verificationForm.classList.add(
            "hidden"
        );

        successScreen.classList.remove(
            "hidden"
        );


    } catch (error) {

        console.error(
            "Verification error:",
            error
        );


        showMainError(
            error.message ||
            "Something went wrong. Please try again."
        );


    } finally {

        submitButton.disabled =
            false;

        submitButton.textContent =
            "Submit Verification";

    }

}


/* =========================================================
   INITIAL PAGE
========================================================= */

updateVerificationType();

</script>

<script>

function changeVerificationType(type) {

    var gstSection =
        document.getElementById("gstSection");

    var panSection =
        document.getElementById("panSection");

    var gstOption =
        document.getElementById("gstOption");

    var panOption =
        document.getElementById("panOption");


    if (type === "PAN") {

        gstSection.style.display = "none";

        panSection.style.display = "block";

        gstOption.classList.remove("selected");

        panOption.classList.add("selected");

    }


    if (type === "GST") {

        gstSection.style.display = "block";

        panSection.style.display = "none";

        gstOption.classList.add("selected");

        panOption.classList.remove("selected");

    }

}

</script>

</body>

</html>
