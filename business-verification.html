<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Business Verification</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #f4f6f8;
    font-family: Arial, sans-serif;
    color: #222;
}

.card {
    max-width: 500px;
    margin: 30px auto;
    background: #fff;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
}

.small {
    color: #777;
    font-size: 13px;
}

.field {
    margin-top: 16px;
}

label.title {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 7px;
}

input[type="text"],
textarea,
input[type="file"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.options {
    display: flex;
    gap: 10px;
}

.option {
    flex: 1;
    padding: 13px;
    border: 2px solid #ddd;
    border-radius: 8px;
    cursor: pointer;
}

.option.active {
    border-color: #198754;
    background: #f0fff7;
}

.upload {
    margin-top: 15px;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.upload label {
    display: block;
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 8px;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    background: #198754;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

button:disabled {
    opacity: .6;
}

.hidden {
    display: none !important;
}

.error {
    display: none;
    margin-top: 12px;
    padding: 10px;
    border-radius: 7px;
    background: #fff0f0;
    color: #c62828;
    font-size: 13px;
}

.success {
    text-align: center;
}

.success-icon {
    width: 65px;
    height: 65px;
    margin: 0 auto 15px;
    border-radius: 50%;
    background: #198754;
    color: white;
    font-size: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.home {
    background: #343a40;
}
</style>
</head>

<body>

<!-- ================= FORM ================= -->

<div class="card" id="verificationForm">

    <h2>Business Verification</h2>

    <p class="small">
        Please provide your business details for verification.
    </p>

    <div id="errorBox" class="error"></div>


    <!-- GST / PAN -->

    <div class="field">

        <label class="title">
            Do you have GST?
        </label>

        <div class="options">

            <label class="option active" id="gstBox">
                <input
                    type="radio"
                    name="verificationType"
                    value="GST"
                    id="gstOption"
                    checked
                >
                I have GST
            </label>

            <label class="option" id="panBox">
                <input
                    type="radio"
                    name="verificationType"
                    value="PAN"
                    id="panOption"
                >
                I don't have GST
            </label>

        </div>
    </div>


    <!-- GST -->

    <div id="gstSection">

        <div class="field">

            <label class="title">
                GST Number
            </label>

            <input
                type="text"
                id="gstNumber"
                maxlength="15"
                placeholder="Enter 15 digit GST number"
            >

        </div>

    </div>


    <!-- PAN -->

    <div id="panSection" class="hidden">

        <div class="field">

            <label class="title">
                PAN Number
            </label>

            <input
                type="text"
                id="panNumber"
                maxlength="10"
                placeholder="Enter PAN number"
            >

        </div>


        <div class="upload">

            <label>
                PAN Card Front Side
            </label>

            <input
                type="file"
                id="panFront"
                accept="image/jpeg,image/png,image/webp"
            >

        </div>


        <div class="upload">

            <label>
                PAN Card Back Side
            </label>

            <input
                type="file"
                id="panBack"
                accept="image/jpeg,image/png,image/webp"
            >

        </div>

    </div>


    <!-- BUSINESS NAME -->

    <div class="field">

        <label class="title">
            Business Name
        </label>

        <input
            type="text"
            id="businessName"
            placeholder="Enter business name"
        >

    </div>


    <!-- ADDRESS -->

    <div class="field">

        <label class="title">
            Business Address
        </label>

        <textarea
            id="businessAddress"
            placeholder="Enter complete business address"
        ></textarea>

    </div>


    <button
        type="button"
        id="submitButton"
    >
        Submit Verification
    </button>

</div>


<!-- ================= SUCCESS ================= -->

<div
    class="card success hidden"
    id="successScreen"
>

    <div class="success-icon">
        ✓
    </div>

    <h2>
        Verification Submitted Successfully
    </h2>

    <p class="small">
        Your business account is being verified.
    </p>

    <button
        type="button"
        class="home"
        id="homeButton"
    >
        Go to Home
    </button>

</div>


<!-- SUPABASE LIBRARY FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- YOUR SUPABASE CONFIG -->
<script src="supabase.js"></script>


<script>

document.addEventListener("DOMContentLoaded", function () {


    /* ============================
       ELEMENTS
    ============================ */

    const gstOption =
        document.getElementById("gstOption");

    const panOption =
        document.getElementById("panOption");

    const gstBox =
        document.getElementById("gstBox");

    const panBox =
        document.getElementById("panBox");

    const gstSection =
        document.getElementById("gstSection");

    const panSection =
        document.getElementById("panSection");

    const gstNumber =
        document.getElementById("gstNumber");

    const panNumber =
        document.getElementById("panNumber");

    const panFront =
        document.getElementById("panFront");

    const panBack =
        document.getElementById("panBack");

    const businessName =
        document.getElementById("businessName");

    const businessAddress =
        document.getElementById("businessAddress");

    const submitButton =
        document.getElementById("submitButton");

    const verificationForm =
        document.getElementById("verificationForm");

    const successScreen =
        document.getElementById("successScreen");

    const errorBox =
        document.getElementById("errorBox");


    /* ============================
       GST / PAN SWITCH
    ============================ */

    function updateType() {

        errorBox.style.display = "none";

        if (panOption.checked) {

            gstSection.classList.add("hidden");

            panSection.classList.remove("hidden");

            gstBox.classList.remove("active");

            panBox.classList.add("active");

            gstNumber.value = "";

        } else {

            gstSection.classList.remove("hidden");

            panSection.classList.add("hidden");

            gstBox.classList.add("active");

            panBox.classList.remove("active");

            panNumber.value = "";

            panFront.value = "";

            panBack.value = "";
        }
    }


    gstOption.addEventListener(
        "change",
        updateType
    );

    panOption.addEventListener(
        "change",
        updateType
    );


    /* ============================
       UPPERCASE
    ============================ */

    gstNumber.addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .toUpperCase()
                    .replace(
                        /[^A-Z0-9]/g,
                        ""
                    );
        }
    );


    panNumber.addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .toUpperCase()
                    .replace(
                        /[^A-Z0-9]/g,
                        ""
                    );
        }
    );


    /* ============================
       ERROR
    ============================ */

    function showError(message) {

        errorBox.textContent = message;

        errorBox.style.display = "block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    /* ============================
       SUBMIT
    ============================ */

    submitButton.addEventListener(
        "click",
        async function () {

            errorBox.style.display = "none";

            submitButton.disabled = true;

            submitButton.textContent =
                "Please wait...";


            let frontPath = null;
            let backPath = null;


            try {

                /* USER */

                const {
                    data: authData,
                    error: authError
                } =
                    await supabaseClient
                        .auth
                        .getUser();


                if (authError) {
                    throw new Error(
                        authError.message
                    );
                }


                if (!authData.user) {
                    throw new Error(
                        "Please login first."
                    );
                }


                const user =
                    authData.user;


                /* TYPE */

                const selected =
                    document.querySelector(
                        'input[name="verificationType"]:checked'
                    );


                if (!selected) {
                    throw new Error(
                        "Please select GST or PAN."
                    );
                }


                const type =
                    selected.value;


                /* VALUES */

                const gst =
                    gstNumber.value
                        .trim()
                        .toUpperCase();

                const pan =
                    panNumber.value
                        .trim()
                        .toUpperCase();

                const name =
                    businessName.value.trim();

                const address =
                    businessAddress.value.trim();


                /* NAME */

                if (!name) {
                    throw new Error(
                        "Please enter your business name."
                    );
                }


                /* ADDRESS */

                if (!address) {
                    throw new Error(
                        "Please enter your business address."
                    );
                }


                /* ========================
                   GST
                ======================== */

                if (type === "GST") {

                    const gstPattern =
                        /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;


                    if (!gstPattern.test(gst)) {

                        throw new Error(
                            "Please enter a valid 15 digit GST number."
                        );
                    }
                }


                /* ========================
                   PAN
                ======================== */

                if (type === "PAN") {

                    const panPattern =
                        /^[A-Z]{5}[0-9]{4}[A-Z]$/;


                    if (!panPattern.test(pan)) {

                        throw new Error(
                            "Please enter a valid 10 digit PAN number."
                        );
                    }


                    if (!panFront.files[0]) {

                        throw new Error(
                            "Please upload PAN front side."
                        );
                    }


                    if (!panBack.files[0]) {

                        throw new Error(
                            "Please upload PAN back side."
                        );
                    }


                    const frontFile =
                        panFront.files[0];

                    const backFile =
                        panBack.files[0];


                    /* FRONT */

                    submitButton.textContent =
                        "Uploading PAN front...";


                    const frontExt =
                        frontFile.name
                            .split(".")
                            .pop()
                            .toLowerCase();


                    frontPath =
                        user.id +
                        "/" +
                        Date.now() +
                        "_front." +
                        frontExt;


                    const frontResult =
                        await supabaseClient
                            .storage
                            .from("pan-documents")
                            .upload(
                                frontPath,
                                frontFile,
                                {
                                    upsert: false,
                                    contentType:
                                        frontFile.type
                                }
                            );


                    if (frontResult.error) {

                        throw new Error(
                            frontResult.error.message
                        );
                    }


                    /* BACK */

                    submitButton.textContent =
                        "Uploading PAN back...";


                    const backExt =
                        backFile.name
                            .split(".")
                            .pop()
                            .toLowerCase();


                    backPath =
                        user.id +
                        "/" +
                        Date.now() +
                        "_back." +
                        backExt;


                    const backResult =
                        await supabaseClient
                            .storage
                            .from("pan-documents")
                            .upload(
                                backPath,
                                backFile,
                                {
                                    upsert: false,
                                    contentType:
                                        backFile.type
                                }
                            );


                    if (backResult.error) {

                        throw new Error(
                            backResult.error.message
                        );
                    }
                }


                /* ========================
                   DATABASE
                ======================== */

                submitButton.textContent =
                    "Saving...";


                const { error } =
                    await supabaseClient
                        .from(
                            "business_verifications"
                        )
                        .insert({

                            user_id:
                                user.id,

                            verification_type:
                                type,

                            gst_number:
                                type === "GST"
                                    ? gst
                                    : null,

                            pan_number:
                                type === "PAN"
                                    ? pan
                                    : null,

                            pan_front_path:
                                frontPath,

                            pan_back_path:
                                backPath,

                            business_name:
                                name,

                            business_address:
                                address,

                            status:
                                "pending"
                        });


                if (error) {
                    throw new Error(
                        error.message
                    );
                }


                /* ========================
                   SUCCESS
                ======================== */

                verificationForm.classList.add(
                    "hidden"
                );

                successScreen.classList.remove(
                    "hidden"
                );


            } catch (error) {

                console.error(error);

                showError(
                    error.message ||
                    "Something went wrong."
                );

            } finally {

                submitButton.disabled = false;

                submitButton.textContent =
                    "Submit Verification";
            }

        }
    );


    /* ============================
       HOME
    ============================ */

    document
        .getElementById("homeButton")
        .addEventListener(
            "click",
            function () {

                window.location.href =
                    "index.html";

            }
        );


    /* INITIAL */

    updateType();

});

</script>

</body>
</html>
