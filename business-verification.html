<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Verification</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #198754;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .options {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option {
            flex: 1;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
        }

        .option.active {
            border-color: #198754;
            background: #f0fff5;
        }

        .option input {
            width: auto;
            margin-right: 8px;
        }

        .option label {
            display: inline;
            cursor: pointer;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 6px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .status-box {
            text-align: center;
            padding: 30px 10px;
        }

        .success-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .status-box h2 {
            margin-bottom: 10px;
        }

        .status-box p {
            color: #666;
            line-height: 1.6;
        }

        #pageError {
            background: #ffeaea;
            color: #b00020;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

    </style>
</head>

<body>

<div class="container">

    <!-- FORM -->
    <div id="verificationForm">

        <h1>Business Verification</h1>

        <p class="subtitle">
            Please provide your business details for verification.
        </p>

        <div id="pageError"></div>


        <!-- GST / PAN -->
        <div class="field">

            <label>
                Do you have GST?
            </label>

            <div class="options">

                <div class="option active" id="gstOptionBox">

                    <input
                        type="radio"
                        name="verification_type"
                        value="GST"
                        id="gstOption"
                        checked
                    >

                    <label for="gstOption">
                        I have GST
                    </label>

                </div>


                <div class="option" id="panOptionBox">

                    <input
                        type="radio"
                        name="verification_type"
                        value="PAN"
                        id="panOption"
                    >

                    <label for="panOption">
                        I don't have GST
                    </label>

                </div>

            </div>

        </div>


        <!-- GST -->
        <div id="gstSection" class="field">

            <label for="gstNumber">
                GST Number
            </label>

            <input
                type="text"
                id="gstNumber"
                placeholder="Enter GST number"
                maxlength="15"
                autocomplete="off"
            >

            <div
                id="gstError"
                class="error"
            ></div>

        </div>


        <!-- PAN -->
        <div
            id="panSection"
            class="field hidden"
        >

            <label for="panNumber">
                PAN Number
            </label>

            <input
                type="text"
                id="panNumber"
                placeholder="Enter PAN number"
                maxlength="10"
                autocomplete="off"
            >

            <div
                id="panError"
                class="error"
            ></div>

        </div>


        <!-- BUSINESS NAME -->
        <div class="field">

            <label for="businessName">
                Business Name
            </label>

            <input
                type="text"
                id="businessName"
                placeholder="Enter business name"
            >

        </div>


        <!-- BUSINESS ADDRESS -->
        <div class="field">

            <label for="businessAddress">
                Business Address
            </label>

            <textarea
                id="businessAddress"
                placeholder="Enter complete business address"
            ></textarea>

        </div>


        <button
            type="button"
            id="submitButton"
        >
            Continue
        </button>

    </div>


    <!-- STATUS -->
    <div
        id="statusBox"
        class="status-box hidden"
    >

        <div
            class="success-icon"
            id="statusIcon"
        >
            ✓
        </div>

        <h2 id="statusTitle">
            Verification Submitted Successfully
        </h2>

        <p id="statusMessage">
            Your business account is being verified.
        </p>

    </div>

</div>


<script>

/* =========================================================
   1. SUPABASE CONFIG
   ========================================================= */

/* =========================================================
   2. GET HTML ELEMENTS
   ========================================================= */

const gstOption =
    document.getElementById("gstOption");

const panOption =
    document.getElementById("panOption");

const gstOptionBox =
    document.getElementById("gstOptionBox");

const panOptionBox =
    document.getElementById("panOptionBox");

const gstSection =
    document.getElementById("gstSection");

const panSection =
    document.getElementById("panSection");

const gstNumber =
    document.getElementById("gstNumber");

const panNumber =
    document.getElementById("panNumber");

const businessName =
    document.getElementById("businessName");

const businessAddress =
    document.getElementById("businessAddress");

const submitButton =
    document.getElementById("submitButton");

const verificationForm =
    document.getElementById("verificationForm");

const statusBox =
    document.getElementById("statusBox");

const statusTitle =
    document.getElementById("statusTitle");

const statusMessage =
    document.getElementById("statusMessage");

const statusIcon =
    document.getElementById("statusIcon");

const gstError =
    document.getElementById("gstError");

const panError =
    document.getElementById("panError");

const pageError =
    document.getElementById("pageError");


/* =========================================================
   3. GST / PAN SWITCH
   ========================================================= */

function updateVerificationMethod() {

    gstError.textContent = "";
    panError.textContent = "";
    pageError.style.display = "none";


    if (panOption.checked) {

        // Show PAN
        panSection.classList.remove("hidden");

        // Hide GST
        gstSection.classList.add("hidden");

        // Active design
        panOptionBox.classList.add("active");
        gstOptionBox.classList.remove("active");

        // Required
        panNumber.required = true;
        gstNumber.required = false;

        // Clear GST
        gstNumber.value = "";

    } else {

        // Show GST
        gstSection.classList.remove("hidden");

        // Hide PAN
        panSection.classList.add("hidden");

        // Active design
        gstOptionBox.classList.add("active");
        panOptionBox.classList.remove("active");

        // Required
        gstNumber.required = true;
        panNumber.required = false;

        // Clear PAN
        panNumber.value = "";
    }
}


/* =========================================================
   4. RADIO EVENTS
   ========================================================= */

gstOption.addEventListener(
    "change",
    updateVerificationMethod
);

panOption.addEventListener(
    "change",
    updateVerificationMethod
);


/* =========================================================
   5. GST INPUT FORMAT
   ========================================================= */

gstNumber.addEventListener(
    "input",
    function () {

        this.value = this.value
            .toUpperCase()
            .replace(/[^A-Z0-9]/g, "")
            .slice(0, 15);

        gstError.textContent = "";
    }
);


/* =========================================================
   6. PAN INPUT FORMAT
   ========================================================= */

panNumber.addEventListener(
    "input",
    function () {

        this.value = this.value
            .toUpperCase()
            .replace(/[^A-Z0-9]/g, "")
            .slice(0, 10);

        panError.textContent = "";
    }
);


/* =========================================================
   7. GET CURRENT USER
   ========================================================= */

async function getCurrentUser() {

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();

    if (error) {

        console.error(
            "Auth error:",
            error
        );

        return null;
    }

    return data.user;
}


/* =========================================================
   8. CHECK EXISTING VERIFICATION
   ========================================================= */

async function checkExistingVerification() {

    const user =
        await getCurrentUser();

    if (!user) {

        showError(
            "Please login to your account before submitting business verification."
        );

        return;
    }


    const {
        data,
        error
    } = await supabaseClient
        .from("business_verifications")
        .select("*")
        .eq("user_id", user.id)
        .order(
            "created_at",
            {
                ascending: false
            }
        )
        .limit(1)
        .maybeSingle();


    if (error) {

        console.error(
            "Database error:",
            error
        );

        return;
    }


    if (!data) {
        return;
    }


    if (data.status === "pending") {

        showStatus(
            "⏳",
            "Verification Pending",
            "Your business verification has been submitted and is currently under review."
        );

    }


    else if (data.status === "verified") {

        showStatus(
            "✓",
            "Business Verified",
            "Your business account has been successfully verified."
        );

    }


    else if (data.status === "rejected") {

        showStatus(
            "!",
            "Verification Rejected",
            data.rejection_reason
                ? "Reason: " + data.rejection_reason
                : "Your verification was rejected. Please submit your information again."
        );

        // Allow resubmission
        verificationForm.classList.remove("hidden");
        statusBox.classList.add("hidden");
    }

}


/* =========================================================
   9. SHOW ERROR
   ========================================================= */

function showError(message) {

    pageError.textContent =
        message;

    pageError.style.display =
        "block";
}


/* =========================================================
   10. SHOW STATUS
   ========================================================= */

function showStatus(
    icon,
    title,
    message
) {

    verificationForm.classList.add(
        "hidden"
    );

    statusBox.classList.remove(
        "hidden"
    );

    statusIcon.textContent =
        icon;

    statusTitle.textContent =
        title;

    statusMessage.textContent =
        message;
}


/* =========================================================
   11. SUBMIT VERIFICATION
   ========================================================= */

submitButton.addEventListener(
    "click",
    async function () {

        pageError.style.display =
            "none";

        gstError.textContent =
            "";

        panError.textContent =
            "";


        /* Disable button */

        submitButton.disabled =
            true;

        submitButton.textContent =
            "Submitting...";


        try {

            /* Get user */

            const user =
                await getCurrentUser();


            if (!user) {

                showError(
                    "You must be logged in before submitting verification."
                );

                return;
            }


            /* Verification type */

            const selected =
                document.querySelector(
                    'input[name="verification_type"]:checked'
                );


            if (!selected) {

                showError(
                    "Please select GST or PAN."
                );

                return;
            }


            const verificationType =
                selected.value;


            /* Get values */

            const gst =
                gstNumber.value
                    .trim()
                    .toUpperCase();

            const pan =
                panNumber.value
                    .trim()
                    .toUpperCase();

            const name =
                businessName.value.trim();

            const address =
                businessAddress.value.trim();


            /* =================================================
               GST VALIDATION
               ================================================= */

            if (
                verificationType === "GST"
            ) {

                const gstRegex =
                    /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;


                if (
                    !gstRegex.test(gst)
                ) {

                    gstError.textContent =
                        "Please enter a valid 15-character GST number.";

                    return;
                }
            }


            /* =================================================
               PAN VALIDATION
               ================================================= */

            if (
                verificationType === "PAN"
            ) {

                const panRegex =
                    /^[A-Z]{5}[0-9]{4}[A-Z]$/;


                if (
                    !panRegex.test(pan)
                ) {

                    panError.textContent =
                        "Please enter a valid 10-character PAN number.";

                    return;
                }
            }


            /* =================================================
               BUSINESS NAME
               ================================================= */

            if (!name) {

                showError(
                    "Please enter your business name."
                );

                return;
            }


            /* =================================================
               BUSINESS ADDRESS
               ================================================= */

            if (!address) {

                showError(
                    "Please enter your business address."
                );

                return;
            }


            /* =================================================
               INSERT DATA
               ================================================= */

            const insertData = {

                user_id: user.id,

                verification_type:
                    verificationType,

                gst_number:
                    verificationType === "GST"
                        ? gst
                        : null,

                pan_number:
                    verificationType === "PAN"
                        ? pan
                        : null,

                business_name:
                    name,

                business_address:
                    address,

                status:
                    "pending"
            };


            console.log(
                "Submitting:",
                insertData
            );


            const {
                data,
                error
            } = await supabaseClient
                .from(
                    "business_verifications"
                )
                .insert(
                    insertData
                )
                .select()
                .single();


            if (error) {

                console.error(
                    "Supabase INSERT error:",
                    error
                );

                showError(
                    error.message
                );

                return;
            }


            console.log(
                "Saved successfully:",
                data
            );


            /* =================================================
               SUCCESS
               ================================================= */

            showStatus(
                "✓",
                "Verification Submitted Successfully",
                "Your business account is being verified."
            );

        }


        catch (error) {

            console.error(
                "Unexpected error:",
                error
            );

            showError(
                error.message ||
                "Something went wrong. Please try again."
            );

        }


        finally {

            submitButton.disabled =
                false;

            submitButton.textContent =
                "Continue";
        }

    }
);


/* =========================================================
   12. INITIAL LOAD
   ========================================================= */

updateVerificationMethod();

checkExistingVerification();

</script>

</body>
</html>
