<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | JS UNDEFINED</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary: #6c4df6;
    --primary-dark: #4d32c8;
    --text: #171717;
    --muted: #777;
    --border: #e3e3e3;
    --bg: #f7f7fb;
    --white: #fff;
    --danger: #dc2626;
    --success: #16a34a;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(108,77,246,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(255,100,180,.14),
            transparent 30%
        ),
        var(--bg);

    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* MAIN */

.login-wrapper {
    width: 100%;
    max-width: 1000px;

    display: grid;
    grid-template-columns: 45% 55%;

    background: var(--white);

    border-radius: 28px;
    overflow: hidden;

    box-shadow:
        0 25px 70px rgba(0,0,0,.12);
}

/* LEFT */

.login-banner {
    position: relative;

    padding: 55px 45px;

    color: white;

    background:
        linear-gradient(
            145deg,
            #17132f,
            #4d32c8 55%,
            #8a55ff
        );

    overflow: hidden;
}

.login-banner::before,
.login-banner::after {
    content: "";

    position: absolute;

    border-radius: 50%;

    background: rgba(255,255,255,.08);
}

.login-banner::before {
    width: 320px;
    height: 320px;

    top: -140px;
    right: -130px;
}

.login-banner::after {
    width: 230px;
    height: 230px;

    bottom: -110px;
    left: -100px;
}

.logo {
    position: relative;
    z-index: 2;

    font-size: 26px;
    font-weight: 800;

    letter-spacing: 1px;
}

.banner-content {
    position: relative;
    z-index: 2;

    margin-top: 120px;
}

.banner-content h1 {
    font-size: 42px;
    line-height: 1.15;

    margin-bottom: 20px;
}

.banner-content p {
    color: rgba(255,255,255,.82);

    font-size: 16px;
    line-height: 1.7;
}

.features {
    margin-top: 35px;
}

.feature {
    display: flex;
    align-items: center;

    gap: 12px;

    margin: 18px 0;

    font-size: 15px;
}

.feature-icon {
    width: 34px;
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: rgba(255,255,255,.15);
}

/* FORM */

.login-section {
    padding: 60px 65px;
}

.login-header {
    margin-bottom: 35px;
}

.login-header h2 {
    font-size: 32px;

    margin-bottom: 8px;
}

.login-header p {
    color: var(--muted);

    font-size: 14px;
}

/* MESSAGE */

.message {
    display: none;

    padding: 12px 14px;

    border-radius: 10px;

    margin-bottom: 18px;

    font-size: 13px;
}

.message.show {
    display: block;
}

.error {
    background: #fff1f2;
    color: var(--danger);
}

.success {
    background: #effdf3;
    color: var(--success);
}

/* INPUT */

.form-group {
    margin-bottom: 22px;
}

label {
    display: block;

    font-size: 14px;
    font-weight: 600;

    margin-bottom: 8px;
}

.input-box {
    position: relative;
}

input {
    width: 100%;
    height: 53px;

    border: 1px solid var(--border);

    border-radius: 13px;

    padding: 0 16px;

    font-size: 15px;

    outline: none;

    transition: .25s;
}

input:focus {
    border-color: var(--primary);

    box-shadow:
        0 0 0 4px rgba(108,77,246,.10);
}

/* PASSWORD */

.password-toggle {
    position: absolute;

    right: 15px;
    top: 50%;

    transform: translateY(-50%);

    border: none;

    background: transparent;

    cursor: pointer;

    font-size: 17px;
}

/* FORGOT */

.forgot-row {
    display: flex;

    justify-content: flex-end;

    margin-top: -8px;
    margin-bottom: 25px;
}

.forgot-row a {
    color: var(--primary);

    text-decoration: none;

    font-size: 14px;

    font-weight: 600;
}

.forgot-row a:hover {
    text-decoration: underline;
}

/* LOGIN BUTTON */

.login-btn {
    width: 100%;
    height: 54px;

    border: none;

    border-radius: 13px;

    color: white;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            #8a55ff
        );

    box-shadow:
        0 10px 25px rgba(108,77,246,.25);

    transition: .25s;
}

.login-btn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 15px 30px rgba(108,77,246,.32);
}

.login-btn:disabled {
    opacity: .65;

    cursor: not-allowed;

    transform: none;
}

/* REGISTER */

.register-text {
    text-align: center;

    margin-top: 25px;

    color: var(--muted);

    font-size: 14px;
}

.register-text a {
    color: var(--primary);

    font-weight: 700;

    text-decoration: none;
}

.register-text a:hover {
    text-decoration: underline;
}

/* DIVIDER */

.divider {
    display: flex;

    align-items: center;

    gap: 12px;

    margin: 25px 0;

    color: #aaa;

    font-size: 12px;
}

.divider::before,
.divider::after {
    content: "";

    height: 1px;

    flex: 1;

    background: #eee;
}

/* MOBILE */

@media(max-width: 800px) {

    .login-wrapper {
        grid-template-columns: 1fr;

        max-width: 600px;
    }

    .login-banner {
        padding: 35px;
    }

    .banner-content {
        margin-top: 55px;
    }

    .banner-content h1 {
        font-size: 32px;
    }

    .features {
        display: none;
    }

    .login-section {
        padding: 40px 30px;
    }
}

@media(max-width: 450px) {

    body {
        padding: 10px;
    }

    .login-wrapper {
        border-radius: 20px;
    }

    .login-banner {
        padding: 28px 22px;
    }

    .banner-content h1 {
        font-size: 28px;
    }

    .login-section {
        padding: 30px 20px;
    }

    .login-header h2 {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<div class="login-wrapper">

    <!-- LEFT SIDE -->

    <section class="login-banner">

        <div class="logo">
            JS UNDEFINED
        </div>

        <div class="banner-content">

            <h1>
                Welcome back.
            </h1>

            <p>
                Login to your JS UNDEFINED account
                and continue shopping or managing
                your business.
            </p>

            <div class="features">

                <div class="feature">
                    <span class="feature-icon">✓</span>
                    Secure account access
                </div>

                <div class="feature">
                    <span class="feature-icon">✓</span>
                    Fast & simple login
                </div>

                <div class="feature">
                    <span class="feature-icon">✓</span>
                    User, Wholesaler & B2B accounts
                </div>

            </div>

        </div>

    </section>


    <!-- LOGIN FORM -->

    <section class="login-section">

        <div class="login-header">

            <h2>
                Login
            </h2>

            <p>
                Enter your account details to continue.
            </p>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <form id="loginForm">

            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- FORGOT PASSWORD -->

            <div class="forgot-row">

                <a href="forgot-password.html">
                    Forgot Password?
                </a>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                LOGIN
            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <!-- REGISTER -->

        <div class="register-text">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>

    </section>

</div>


<script>

/* =========================
   SHOW / HIDE PASSWORD
========================= */

const password =
    document.getElementById("password");

const togglePassword =
    document.getElementById("togglePassword");

togglePassword.addEventListener(
    "click",
    function () {

        if (password.type === "password") {

            password.type = "text";

            togglePassword.textContent = "🙈";

        } else {

            password.type = "password";

            togglePassword.textContent = "👁";

        }

    }
);


/* =========================
   LOGIN
========================= */

document
.getElementById("loginForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const email =
        document.getElementById("email")
        .value
        .trim();

    const passwordValue =
        password.value;

    const loginBtn =
        document.getElementById("loginBtn");


    if (!email || !passwordValue) {

        showMessage(
            "Please enter your email and password.",
            "error"
        );

        return;

    }


    try {

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: passwordValue
        });

    if (error) {
        throw error;
    }

    showMessage(
        "Login successful! Redirecting...",
        "success"
    );

    setTimeout(() => {
        window.location.href = "index.html";
    }, 1000);

} catch (error) {

    showMessage(
        error.message,
        "error"
    );

} finally {

    loginBtn.disabled = false;

    loginBtn.textContent = "LOGIN";
}
    /*
       SUPABASE LOGIN
       WILL BE CONNECTED HERE.
    */

    setTimeout(() => {

        loginBtn.disabled = false;

        loginBtn.textContent =
            "LOGIN";

        showMessage(
            "Login system is ready to connect with Supabase.",
            "success"
        );

    }, 1000);

});


/* =========================
   MESSAGE
========================= */

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message show " + type;

}

</script>

</body>
</html>
