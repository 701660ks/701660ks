<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JS UNDEFINED - Admin Users</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6fa;
    color: #222;
}

/* HEADER */

.header {
    background: #111827;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.admin-title {
    font-size: 14px;
}

/* PAGE */

.container {
    max-width: 1400px;
    margin: auto;
    padding: 25px;
}

h1 {
    margin-bottom: 20px;
}

/* CARDS */

.stats {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
}

.card-title {
    color: #666;
    font-size: 14px;
}

.card-number {
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

/* FILTERS */

.filters {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;

    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

input,
select {
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
}

.search {
    flex: 1;
    min-width: 220px;
}

/* TABLE */

.table-container {
    background: white;
    border-radius: 12px;
    overflow-x: auto;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    background: #f8f9fb;
    font-size: 13px;
}

td {
    font-size: 14px;
}

/* STATUS */

.status {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.pending {
    background: #fff3cd;
    color: #856404;
}

.approved {
    background: #d1fae5;
    color: #065f46;
}

.rejected {
    background: #fee2e2;
    color: #991b1b;
}

/* BUTTONS */

button {
    border: none;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 600;
}

.view-btn {
    background: #e5e7eb;
}

.approve-btn {
    background: #16a34a;
    color: white;
}

.reject-btn {
    background: #dc2626;
    color: white;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

/* MOBILE */

@media(max-width: 800px) {

    .stats {
        grid-template-columns:
            repeat(2, 1fr);
    }

    th,
    td {
        white-space: nowrap;
    }

}

@media(max-width: 500px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 15px;
    }

}

</style>

</head>

<body>

<header class="header">

    <div class="logo">
        JS UNDEFINED
    </div>

    <div class="admin-title">
        ADMIN PANEL
    </div>

</header>


<main class="container">

<h1>User Management</h1>


<!-- STATISTICS -->

<div class="stats">

    <div class="card">
        <div class="card-title">
            Total Users
        </div>

        <div
            class="card-number"
            id="totalUsers">
            0
        </div>
    </div>


    <div class="card">
        <div class="card-title">
            Pending
        </div>

        <div
            class="card-number"
            id="pendingUsers">
            0
        </div>
    </div>


    <div class="card">
        <div class="card-title">
            Approved
        </div>

        <div
            class="card-number"
            id="approvedUsers">
            0
        </div>
    </div>


    <div class="card">
        <div class="card-title">
            Rejected
        </div>

        <div
            class="card-number"
            id="rejectedUsers">
            0
        </div>
    </div>

</div>


<!-- FILTERS -->

<div class="filters">

    <input
        type="text"
        id="searchInput"
        class="search"
        placeholder="Search name, email or mobile..."
    >


    <select id="typeFilter">

        <option value="all">
            All Types
        </option>

        <option value="User">
            User
        </option>

        <option value="Wholesaler">
            Wholesaler
        </option>

        <option value="B2B">
            B2B
        </option>

    </select>


    <select id="statusFilter">

        <option value="all">
            All Status
        </option>

        <option value="pending">
            Pending
        </option>

        <option value="approved">
            Approved
        </option>

        <option value="rejected">
            Rejected
        </option>

    </select>

</div>


<!-- USERS TABLE -->

<div class="table-container">

<table>

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Mobile</th>

<th>Type</th>

<th>Status</th>

<th>Registered</th>

<th>Action</th>

</tr>

</thead>


<tbody id="usersTable">

<tr>

<td colspan="7">
Loading users...
</td>

</tr>

</tbody>

</table>

</div>

</main>


<script>

async function loadAdminData() {

  const message = document.getElementById("message");

  try {

    // Check logged-in user
    const {
      data: { user },
      error: userError
    } = await supabaseClient.auth.getUser();

    if (userError) {
      throw userError;
    }

    if (!user) {
      window.location.href = "login.html";
      return;
    }

    // Check admin profile
    const {
      data: adminProfile,
      error: adminError
    } = await supabaseClient
      .from("profiles")
      .select("id, full_name, email, is_admin")
      .eq("id", user.id)
      .single();

    if (adminError) {
      throw adminError;
    }

    if (!adminProfile || adminProfile.is_admin !== true) {
      message.innerText = "Access denied. You are not an admin.";
      return;
    }

    // Load all users
    const {
      data: users,
      error: usersError
    } = await supabaseClient
      .from("profiles")
      .select("*")
      .order("created_at", { ascending: false });

    if (usersError) {
      throw usersError;
    }

    console.log("Users:", users);

    displayUsers(users);

    message.innerText = "";

  } catch (error) {

    console.error("ADMIN ERROR:", error);

    message.innerText =
      "Database error: " + (error.message || error);

  }
}


function displayUsers(users) {

  const tableBody = document.querySelector("#usersTableBody");

  if (!tableBody) {
    console.error("usersTableBody not found");
    return;
  }

  tableBody.innerHTML = "";

  // Counters
  const total = users.length;

  const pending = users.filter(
    u => u.account_status === "pending_admin"
  ).length;

  const approved = users.filter(
    u =>
      u.account_status === "approved" ||
      u.account_status === "active"
  ).length;

  const rejected = users.filter(
    u => u.account_status === "rejected"
  ).length;

  // Update counters
  document.getElementById("totalUsers").innerText = total;
  document.getElementById("pendingUsers").innerText = pending;
  document.getElementById("approvedUsers").innerText = approved;
  document.getElementById("rejectedUsers").innerText = rejected;


  if (users.length === 0) {

    tableBody.innerHTML = `
      <tr>
        <td colspan="7" style="text-align:center;padding:20px;">
          No users found
        </td>
      </tr>
    `;

    return;
  }


  users.forEach(user => {

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${escapeHtml(user.full_name || "")}</td>

      <td>${escapeHtml(user.email || "")}</td>

      <td>${escapeHtml(user.mobile || "")}</td>

      <td>${escapeHtml(user.user_type || "")}</td>

      <td>${escapeHtml(user.account_status || "")}</td>

      <td>
        ${
          user.created_at
            ? new Date(user.created_at).toLocaleDateString()
            : ""
        }
      </td>

      <td>
        ${
          user.user_type === "wholesaler" ||
          user.user_type === "b2b"
            ? `
              <button onclick="approveUser('${user.id}')">
                Approve
              </button>

              <button onclick="rejectUser('${user.id}')">
                Reject
              </button>
            `
            : "-"
        }
      </td>
    `;

    tableBody.appendChild(row);

  });

}


async function approveUser(id) {

  const { error } = await supabaseClient
    .from("profiles")
    .update({
      account_status: "approved"
    })
    .eq("id", id);

  if (error) {

    alert("Approval error: " + error.message);

    return;
  }

  alert("User approved.");

  loadAdminData();
}


async function rejectUser(id) {

  const { error } = await supabaseClient
    .from("profiles")
    .update({
      account_status: "rejected"
    })
    .eq("id", id);

  if (error) {

    alert("Rejection error: " + error.message);

    return;
  }

  alert("User rejected.");

  loadAdminData();
}


async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href = "login.html";
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


loadAdminData();

</script>

</body>
</html>
