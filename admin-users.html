<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JS UNDEFINED - Admin Users</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6fa;
    color: #222;
}

/* HEADER */

.header {
    background: #111827;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.admin-title {
    font-size: 14px;
}

/* PAGE */

.container {
    max-width: 1400px;
    margin: auto;
    padding: 25px;
}

h1 {
    margin-bottom: 20px;
}

/* CARDS */

.stats {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
}

.card-title {
    color: #666;
    font-size: 14px;
}

.card-number {
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

/* FILTERS */

.filters {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;

    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

input,
select {
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
}

.search {
    flex: 1;
    min-width: 220px;
}

/* TABLE */

.table-container {
    background: white;
    border-radius: 12px;
    overflow-x: auto;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    background: #f8f9fb;
    font-size: 13px;
}

td {
    font-size: 14px;
}

/* STATUS */

.status {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.pending {
    background: #fff3cd;
    color: #856404;
}

.approved {
    background: #d1fae5;
    color: #065f46;
}

.rejected {
    background: #fee2e2;
    color: #991b1b;
}

/* BUTTONS */

button {
    border: none;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 600;
}

.view-btn {
    background: #e5e7eb;
}

.approve-btn {
    background: #16a34a;
    color: white;
}

.reject-btn {
    background: #dc2626;
    color: white;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

/* MOBILE */

@media(max-width: 800px) {

    .stats {
        grid-template-columns:
            repeat(2, 1fr);
    }

    th,
    td {
        white-space: nowrap;
    }

}

@media(max-width: 500px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 15px;
    }

}


/* =====================================
   USER EDITOR
===================================== */

.user-editor {

    background: white;

    margin-top: 25px;

    padding: 25px;

    border-radius: 12px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.08);
}


.user-editor h2 {

    margin-bottom: 20px;

    font-size: 22px;
}


.editor-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 18px;
}


.editor-field label {

    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    font-weight: 600;
}


.editor-field input,
.editor-field select {

    width: 100%;

    height: 45px;

    padding: 0 12px;

    border: 1px solid #ddd;

    border-radius: 8px;

    font-size: 14px;

    outline: none;
}


.editor-field input:focus,
.editor-field select:focus {

    border-color: #6c4df6;

    box-shadow:
        0 0 0 3px rgba(108,77,246,.10);
}


.editor-buttons {

    display: flex;

    gap: 10px;

    margin-top: 22px;

    flex-wrap: wrap;
}


.save-user-btn {

    background: #6c4df6;

    color: white;
}


.new-user-btn {

    background: #16a34a;

    color: white;
}


.cancel-user-btn {

    background: #e5e7eb;

    color: #222;
}


@media(max-width:700px) {

    .editor-grid {

        grid-template-columns: 1fr;

    }

}

</style>

</head>

<body>

<header class="header">

    <div class="logo">
        JS UNDEFINED
    </div>

    <div class="admin-title">
        ADMIN PANEL
    </div>

</header>


<main class="container">

<h1>User Management</h1>


<!-- STATISTICS -->

<div class="stats">

    <div class="card">
        <div class="card-title">
            Total Users
        </div>

        <div
            class="card-number"
            id="totalUsers">
            0
        </div>
    </div>


    <div class="card">
        <div class="card-title">
            Pending
        </div>

        <div
            class="card-number"
            id="pendingUsers">
            0
        </div>
    </div>


    <div class="card">
        <div class="card-title">
            Approved
        </div>

        <div
            class="card-number"
            id="approvedUsers">
            0
        </div>
    </div>


    <div class="card">
        <div class="card-title">
            Rejected
        </div>

        <div
            class="card-number"
            id="rejectedUsers">
            0
        </div>
    </div>

</div>


<!-- FILTERS -->

<div class="filters">

    <input
        type="text"
        id="searchInput"
        class="search"
        placeholder="Search name, email or mobile..."
    >


    <select id="typeFilter">

        <option value="all">
            All Types
        </option>

        <option value="User">
            User
        </option>

        <option value="Wholesaler">
            Wholesaler
        </option>

        <option value="B2B">
            B2B
        </option>

    </select>


    <select id="statusFilter">

        <option value="all">
            All Status
        </option>

        <option value="pending">
            Pending
        </option>

        <option value="approved">
            Approved
        </option>

        <option value="rejected">
            Rejected
        </option>

    </select>

</div>


<!-- USERS TABLE -->

<div class="table-container">

<table>

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Mobile</th>

<th>Type</th>

<th>Status</th>

<th>Registered</th>

<th>Action</th>

</tr>

</thead>


<tbody id="usersTable">

<tr>

<td colspan="7">
Loading users...
</td>

</tr>

</tbody>

</table>

</div>


<!-- =====================================
     ADD / EDIT USER SECTION
===================================== -->

<div class="user-editor">

    <h2 id="editorTitle">
        Add New User
    </h2>

    <div class="editor-grid">

        <!-- FULL NAME -->

        <div class="editor-field">

            <label>
                Full Name
            </label>

            <input
                type="text"
                id="editFullName"
                placeholder="Enter full name"
            >

        </div>


        <!-- EMAIL -->

        <div class="editor-field">

            <label>
                Email
            </label>

            <input
                type="email"
                id="editEmail"
                placeholder="Enter email"
            >

        </div>


        <!-- MOBILE -->

        <div class="editor-field">

            <label>
                Mobile
            </label>

            <input
                type="text"
                id="editMobile"
                placeholder="Enter mobile number"
            >

        </div>


        <!-- USER TYPE -->

        <div class="editor-field">

            <label>
                User Type
            </label>

            <select id="editUserType">

                <option value="user">
                    User
                </option>

                <option value="wholesaler">
                    Wholesaler
                </option>

                <option value="b2b">
                    B2B
                </option>

            </select>

        </div>


        <!-- STATUS -->

        <div class="editor-field">

            <label>
                Account Status
            </label>

            <select id="editStatus">

                <option value="active">
                    Active
                </option>

                <option value="pending_admin">
                    Pending
                </option>

                <option value="approved">
                    Approved
                </option>

                <option value="rejected">
                    Rejected
                </option>

            </select>

        </div>

    </div>


    <!-- BUTTONS -->

    <div class="editor-buttons">

        <button
            class="save-user-btn"
            onclick="saveUser()">

            💾 Save User

        </button>


        <button
            class="new-user-btn"
            onclick="newUser()">

            ➕ New User

        </button>


        <button
            class="cancel-user-btn"
            onclick="cancelEdit()">

            Cancel

        </button>

    </div>

</div>

</main>


<script>

async function loadAdminData() {

    try {

        // ==============================
        // 1. CHECK LOGIN
        // ==============================

        const {
            data: { user },
            error: userError
        } = await supabaseClient.auth.getUser();

        if (userError) {
            throw userError;
        }

        if (!user) {
            window.location.href = "login.html";
            return;
        }


        // ==============================
        // 2. CHECK ADMIN
        // ==============================

        const {
            data: adminProfile,
            error: adminError
        } = await supabaseClient
            .from("profiles")
            .select("id, full_name, email, is_admin")
            .eq("id", user.id)
            .single();

        if (adminError) {
            throw adminError;
        }

        if (!adminProfile || adminProfile.is_admin !== true) {

            document.querySelector("#usersTable").innerHTML = `
                <tr>
                    <td colspan="7"
                        style="text-align:center;padding:20px;color:red;">
                        Access denied. This account is not an admin.
                    </td>
                </tr>
            `;

            return;
        }


        // ==============================
        // 3. LOAD ALL USERS
        // ==============================

        const {
            data: users,
            error: usersError
        } = await supabaseClient
            .from("profiles")
            .select("*")
            .order("created_at", {
                ascending: false
            });

        if (usersError) {
            throw usersError;
        }


        console.log("USERS FROM SUPABASE:", users);


        // ==============================
        // 4. SHOW USERS
        // ==============================

        displayUsers(users);

    }

    catch (error) {

        console.error("ADMIN ERROR:", error);

        document.querySelector("#usersTable").innerHTML = `
            <tr>
                <td colspan="7"
                    style="text-align:center;padding:20px;color:red;">
                    Error: ${escapeHtml(error.message || String(error))}
                </td>
            </tr>
        `;

    }
}



function displayUsers(users) {

    // IMPORTANT:
    // Your HTML uses usersTable
    const tableBody = document.querySelector("#usersTable");

    if (!tableBody) {
        console.error("usersTable not found");
        return;
    }


    // ==============================
    // STATISTICS
    // ==============================

    const total = users.length;

    const pending = users.filter(user =>
        user.account_status === "pending_admin"
    ).length;

    const approved = users.filter(user =>
        user.account_status === "approved" ||
        user.account_status === "active"
    ).length;

    const rejected = users.filter(user =>
        user.account_status === "rejected"
    ).length;


    document.getElementById("totalUsers").innerText = total;

    document.getElementById("pendingUsers").innerText = pending;

    document.getElementById("approvedUsers").innerText = approved;

    document.getElementById("rejectedUsers").innerText = rejected;


    // ==============================
    // NO USERS
    // ==============================

    if (!users.length) {

        tableBody.innerHTML = `
            <tr>
                <td colspan="7"
                    style="text-align:center;padding:20px;">
                    No users found
                </td>
            </tr>
        `;

        return;
    }


    // ==============================
    // CREATE USER ROWS
    // ==============================

    tableBody.innerHTML = "";


    users.forEach(user => {

        const row = document.createElement("tr");


        let statusClass = "";

        if (user.account_status === "pending_admin") {
            statusClass = "pending";
        }

        else if (
            user.account_status === "approved" ||
            user.account_status === "active"
        ) {
            statusClass = "approved";
        }

        else if (user.account_status === "rejected") {
            statusClass = "rejected";
        }


        let actionHTML = "-";


        // Wholesaler / B2B approval buttons
        if (
            user.user_type === "wholesaler" ||
            user.user_type === "b2b"
        ) {

            if (user.account_status === "pending_admin") {

                actionHTML = `
                    <div class="actions">

                        <button
                            class="approve-btn"
                            onclick="approveUser('${user.id}')">
                            Approve
                        </button>

                        <button
                            class="reject-btn"
                            onclick="rejectUser('${user.id}')">
                            Reject
                        </button>

                    </div>
                `;

            }

            else {

                actionHTML = `
                    <span>
                        No action
                    </span>
                `;

            }
        }


        row.innerHTML = `

            <td>
                ${escapeHtml(user.full_name || "")}
            </td>

            <td>
                ${escapeHtml(user.email || "")}
            </td>

            <td>
                ${escapeHtml(user.mobile || "")}
            </td>

            <td>
                ${escapeHtml(user.user_type || "")}
            </td>

            <td>

                <span class="status ${statusClass}">
                    ${escapeHtml(user.account_status || "")}
                </span>

            </td>

            <td>
                ${
                    user.created_at
                    ? new Date(user.created_at)
                        .toLocaleDateString()
                    : ""
                }
            </td>

            <td>
                ${actionHTML}
            </td>

        `;


        tableBody.appendChild(row);

    });

}



// ==============================
// APPROVE USER
// ==============================

async function approveUser(id) {

    const confirmed = confirm(
        "Approve this user?"
    );

    if (!confirmed) {
        return;
    }


    const {
        error
    } = await supabaseClient
        .from("profiles")
        .update({
            account_status: "approved"
        })
        .eq("id", id);


    if (error) {

        alert(
            "Approval error: " +
            error.message
        );

        return;
    }


    alert("User approved successfully.");

    loadAdminData();

}



// ==============================
// REJECT USER
// ==============================

async function rejectUser(id) {

    const confirmed = confirm(
        "Reject this user?"
    );

    if (!confirmed) {
        return;
    }


    const {
        error
    } = await supabaseClient
        .from("profiles")
        .update({
            account_status: "rejected"
        })
        .eq("id", id);


    if (error) {

        alert(
            "Rejection error: " +
            error.message
        );

        return;
    }


    alert("User rejected successfully.");

    loadAdminData();

}



// ==============================
// LOGOUT
// ==============================

async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href = "login.html";

}



// ==============================
// HTML SECURITY
// ==============================

function escapeHtml(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}



// ==============================
// START
// ==============================

loadAdminData();
function displayUsers(users) {

    const tableBody =
        document.querySelector("#usersTable");

    if (!tableBody) {

        console.error(
            "usersTable not found"
        );

        return;
    }


    // ==============================
    // COUNTERS
    // ==============================

    const total =
        users.length;

    const pending =
        users.filter(
            u =>
                u.account_status ===
                "pending_admin"
        ).length;

    const approved =
        users.filter(
            u =>
                u.account_status ===
                    "approved" ||
                u.account_status ===
                    "active"
        ).length;

    const rejected =
        users.filter(
            u =>
                u.account_status ===
                "rejected"
        ).length;


    document.getElementById(
        "totalUsers"
    ).innerText = total;


    document.getElementById(
        "pendingUsers"
    ).innerText = pending;


    document.getElementById(
        "approvedUsers"
    ).innerText = approved;


    document.getElementById(
        "rejectedUsers"
    ).innerText = rejected;


    // ==============================
    // NO USERS
    // ==============================

    if (!users.length) {

        tableBody.innerHTML = `
            <tr>
                <td
                    colspan="7"
                    style="
                        text-align:center;
                        padding:25px;
                    "
                >
                    No users found
                </td>
            </tr>
        `;

        return;
    }


    tableBody.innerHTML = "";


    // ==============================
    // USERS
    // ==============================

    users.forEach(user => {

        const row =
            document.createElement("tr");


        let statusClass = "";


        if (
            user.account_status ===
            "pending_admin"
        ) {

            statusClass =
                "pending";

        }

        else if (
            user.account_status ===
                "approved" ||
            user.account_status ===
                "active"
        ) {

            statusClass =
                "approved";

        }

        else if (
            user.account_status ===
            "rejected"
        ) {

            statusClass =
                "rejected";
        }


        row.innerHTML = `

            <td>
                ${escapeHtml(
                    user.full_name || ""
                )}
            </td>

            <td>
                ${escapeHtml(
                    user.email || ""
                )}
            </td>

            <td>
                ${escapeHtml(
                    user.mobile || ""
                )}
            </td>

            <td>
                ${escapeHtml(
                    user.user_type || ""
                )}
            </td>

            <td>

                <span class="status ${statusClass}">

                    ${escapeHtml(
                        user.account_status || ""
                    )}

                </span>

            </td>

            <td>

                ${
                    user.created_at
                    ? new Date(
                        user.created_at
                    ).toLocaleDateString()
                    : ""
                }

            </td>

            <td>

                <div class="actions">

                    <button
                        class="view-btn"
                        onclick="editUser('${user.id}')">

                        ✏️ Edit

                    </button>


                    <button
                        class="reject-btn"
                        onclick="deleteUser('${user.id}')">

                        🗑️ Delete

                    </button>

                </div>

            </td>
        `;


        tableBody.appendChild(row);

    });

}
</script>
</body>
</html>
