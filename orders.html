<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - JS UNDEFINED</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f8;
            color: #111827;
        }

        /* ================= HEADER ================= */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 68px;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .logo span {
            color: #60a5fa;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-name {
            font-size: 14px;
            color: #d1d5db;
            margin-right: 8px;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header-btn {
            border: 1px solid #374151;
            background: #1f2937;
            color: white;
            border-radius: 8px;
            height: 38px;
            padding: 0 13px;
            cursor: pointer;
            font-size: 13px;
        }

        .header-btn:hover {
            background: #374151;
        }

        .logout-btn {
            background: #dc2626;
            border-color: #dc2626;
        }

        .logout-btn:hover {
            background: #b91c1c;
        }

        /* ================= PAGE ================= */

        .container {
            width: min(1400px, calc(100% - 40px));
            margin: 0 auto;
            padding: 30px 0 60px;
        }

        .page-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .page-title p {
            color: #6b7280;
            font-size: 14px;
        }

        .back-btn {
            border: 1px solid #d1d5db;
            background: white;
            color: #111827;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #f3f4f6;
        }

        /* ================= FILTER BAR ================= */

        .filter-bar {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .search-box {
            flex: 1;
            min-width: 180px;
        }

        .search-box input,
        .filter-select {
            width: 100%;
            height: 42px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 0 12px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        .search-box input:focus,
        .filter-select:focus {
            border-color: #2563eb;
        }

        .filter-select {
            width: 190px;
        }

        /* ================= ORDERS ================= */

        .orders-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .orders-card-header {
            padding: 18px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .orders-card-header h2 {
            font-size: 17px;
        }

        .order-count {
            color: #6b7280;
            font-size: 13px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1050px;
        }

        th {
            background: #f9fafb;
            color: #374151;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .3px;
            text-align: left;
            padding: 13px 15px;
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f0f1f3;
            font-size: 13px;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #fafafa;
        }

        .order-number {
            font-weight: 700;
            color: #2563eb;
            white-space: nowrap;
        }

        .product-name {
            font-weight: 600;
            color: #111827;
            max-width: 190px;
        }

        .date-text {
            color: #6b7280;
            white-space: nowrap;
            font-size: 12px;
        }

        .money {
            font-weight: 600;
            white-space: nowrap;
        }

        .quantity {
            font-weight: 600;
            text-align: center;
        }

        /* ================= STATUS ================= */

        .status {
            display: inline-flex;
            align-items: center;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            text-transform: capitalize;
            white-space: nowrap;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-confirmed {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-packed {
            background: #e0e7ff;
            color: #4338ca;
        }

        .status-shipped {
            background: #ede9fe;
            color: #6d28d9;
        }

        .status-out_for_delivery {
            background: #cffafe;
            color: #0e7490;
        }

        .status-delivered {
            background: #dcfce7;
            color: #166534;
        }

        .status-cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .tracking {
            color: #374151;
            font-size: 12px;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .no-tracking {
            color: #9ca3af;
        }

        .track-btn {
            border: none;
            background: #111827;
            color: white;
            border-radius: 7px;
            padding: 8px 11px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .track-btn:hover {
            background: #2563eb;
        }

        /* ================= EMPTY / LOADING ================= */

        .empty-state,
        .loading-state {
            padding: 60px 20px;
            text-align: center;
            color: #6b7280;
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            color: #111827;
            font-size: 18px;
            margin-bottom: 7px;
        }

        .empty-state p {
            font-size: 13px;
            margin-bottom: 18px;
        }

        .shop-btn {
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            padding: 10px 17px;
            cursor: pointer;
            font-weight: 600;
        }

        .shop-btn:hover {
            background: #1d4ed8;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #e5e7eb;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ================= MODAL ================= */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: min(600px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
        }

        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h2 {
            font-size: 18px;
        }

        .close-btn {
            width: 34px;
            height: 34px;
            border: none;
            background: #f3f4f6;
            border-radius: 7px;
            cursor: pointer;
            font-size: 20px;
            color: #374151;
        }

        .close-btn:hover {
            background: #e5e7eb;
        }

        .modal-body {
            padding: 20px;
        }

        .order-summary {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 22px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 7px 0;
            font-size: 13px;
        }

        .summary-row span:first-child {
            color: #6b7280;
        }

        .summary-row strong {
            text-align: right;
            word-break: break-word;
        }

        /* ================= TIMELINE ================= */

        .timeline-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .timeline {
            position: relative;
            padding-left: 35px;
        }

        .timeline::before {
            content: "";
            position: absolute;
            left: 9px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: #e5e7eb;
        }

        .timeline-item {
            position: relative;
            padding-bottom: 22px;
        }

        .timeline-item:last-child {
            padding-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: -32px;
            top: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            border: 3px solid #d1d5db;
            z-index: 1;
        }

        .timeline-item.active .timeline-dot {
            border-color: #2563eb;
            background: #2563eb;
        }

        .timeline-item.completed .timeline-dot {
            border-color: #16a34a;
            background: #16a34a;
        }

        .timeline-item.cancelled .timeline-dot {
            border-color: #dc2626;
            background: #dc2626;
        }

        .timeline-item h4 {
            font-size: 13px;
            margin-bottom: 4px;
        }

        .timeline-item p {
            color: #6b7280;
            font-size: 12px;
            line-height: 1.5;
        }

        .timeline-item.active h4 {
            color: #2563eb;
        }

        .timeline-item.completed h4 {
            color: #166534;
        }

        .timeline-item.cancelled h4 {
            color: #991b1b;
        }

        /* ================= MESSAGE ================= */

        .message {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 5000;
            min-width: 260px;
            max-width: 400px;
            padding: 13px 16px;
            border-radius: 9px;
            color: white;
            font-size: 13px;
            box-shadow: 0 8px 25px rgba(0,0,0,.18);
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #16a34a;
        }

        .message.error {
            background: #dc2626;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 800px) {

            header {
                padding: 0 15px;
            }

            .user-name {
                display: none;
            }

            .container {
                width: min(100% - 24px, 1400px);
                padding-top: 20px;
            }

            .page-top {
                align-items: flex-start;
            }

            .page-title h1 {
                font-size: 23px;
            }

            .filter-bar {
                flex-direction: column;
            }

            .filter-select {
                width: 100%;
            }
        }

        @media (max-width: 600px) {

            header {
                height: 60px;
            }

            .logo {
                font-size: 17px;
            }

            .header-btn {
                height: 34px;
                padding: 0 9px;
                font-size: 11px;
            }

            .page-top {
                flex-direction: column;
            }

            .back-btn {
                width: 100%;
            }

            .orders-card-header {
                padding: 15px;
            }

            .orders-card-header h2 {
                font-size: 15px;
            }

            .modal {
                border-radius: 10px;
            }

            .modal-body {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        JS <span>UNDEFINED</span>
    </div>

    <div class="header-right">

        <div class="user-name" id="userName">
            Loading...
        </div>

        <button class="header-btn" onclick="searchOrders()">
            🔍 Search
        </button>

        <button class="header-btn" onclick="openMenu()">
            ☰ Menu
        </button>

        <button class="header-btn logout-btn" onclick="logout()">
            Logout
        </button>

    </div>

</header>


<!-- ================= MAIN ================= -->

<main class="container">

    <div class="page-top">

        <div class="page-title">
            <h1>My Orders</h1>
            <p>View your orders and track your deliveries.</p>
        </div>

        <button class="back-btn" onclick="goBack()">
            ← Continue Shopping
        </button>

    </div>


    <!-- ================= FILTER ================= -->

    <div class="filter-bar">

        <div class="search-box">
            <input
                type="text"
                id="orderSearch"
                placeholder="Search order ID, product name or tracking number..."
                oninput="filterOrders()"
            >
        </div>

        <select
            id="statusFilter"
            class="filter-select"
            onchange="filterOrders()"
        >
            <option value="all">All Status</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="packed">Packed</option>
            <option value="shipped">Shipped</option>
            <option value="out_for_delivery">Out for Delivery</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
        </select>

    </div>


    <!-- ================= ORDERS CARD ================= -->

    <section class="orders-card">

        <div class="orders-card-header">

            <h2>Your Orders</h2>

            <div class="order-count" id="orderCount">
                0 orders
            </div>

        </div>


        <div id="ordersContent">

            <div class="loading-state">
                <div class="spinner"></div>
                Loading your orders...
            </div>

        </div>

    </section>

</main>


<!-- ================= TRACKING MODAL ================= -->

<div
    class="modal-overlay"
    id="trackingModal"
    onclick="closeTrackingOnOverlay(event)"
>

    <div class="modal">

        <div class="modal-header">

            <h2>Track Order</h2>

            <button
                class="close-btn"
                onclick="closeTrackingModal()"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <div
                class="order-summary"
                id="trackingSummary"
            >
            </div>


            <div class="timeline-title">
                Order Status
            </div>


            <div
                class="timeline"
                id="trackingTimeline"
            >
            </div>

        </div>

    </div>

</div>


<!-- ================= MESSAGE ================= -->

<div
    id="message"
    class="message"
></div>


<script>

    /* =========================================================
       GLOBAL VARIABLES
    ========================================================= */

    let currentUser = null;
    let allOrders = [];
    let filteredOrders = [];
    let trackingOrder = null;


    /* =========================================================
       LOAD USER
    ========================================================= */

    async function loadUser() {

        try {

            const {
                data: {
                    user
                },
                error
            } = await supabaseClient.auth.getUser();

            if (error) {
                throw error;
            }

            if (!user) {

                window.location.href = "login.html";
                return;

            }

            currentUser = user;


            /* ================= PROFILE ================= */

            const {
                data: profile,
                error: profileError
            } = await supabaseClient
                .from("profiles")
                .select("*")
                .eq("id", user.id)
                .maybeSingle();


            if (profileError) {
                console.error(
                    "PROFILE ERROR:",
                    profileError
                );
            }


            let displayName =
                profile?.full_name ||
                profile?.name ||
                profile?.username ||
                user.user_metadata?.full_name ||
                user.user_metadata?.name ||
                user.email ||
                "User";


            document.getElementById("userName").textContent =
                displayName;


            await loadOrders();

        } catch (error) {

            console.error(
                "LOAD USER ERROR:",
                error
            );

            showMessage(
                error.message ||
                "Could not load user.",
                "error"
            );

        }

    }


    /* =========================================================
       LOAD ORDERS
    ========================================================= */

    async function loadOrders() {

        const content =
            document.getElementById("ordersContent");


        content.innerHTML = `
            <div class="loading-state">
                <div class="spinner"></div>
                Loading your orders...
            </div>
        `;


        try {

            const {
                data,
                error
            } = await supabaseClient
                .from("orders")
                .select("*")
                .eq("user_id", currentUser.id)
                .order("created_at", {
                    ascending: false
                });


            if (error) {
                throw error;
            }


            allOrders = data || [];

            filteredOrders = [...allOrders];


            renderOrders();


        } catch (error) {

            console.error(
                "LOAD ORDERS ERROR:",
                error
            );


            content.innerHTML = `
                <div class="empty-state">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <h3>
                        Could not load orders
                    </h3>

                    <p>
                        ${escapeHtml(
                            error.message ||
                            "Something went wrong."
                        )}
                    </p>

                </div>
            `;


            showMessage(
                error.message ||
                "Could not load orders.",
                "error"
            );

        }

    }


    /* =========================================================
       RENDER ORDERS
    ========================================================= */

    function renderOrders() {

        const content =
            document.getElementById("ordersContent");

        const count =
            document.getElementById("orderCount");


        count.textContent =
            `${filteredOrders.length} ${
                filteredOrders.length === 1
                    ? "order"
                    : "orders"
            }`;


        if (!filteredOrders.length) {

            content.innerHTML = `
                <div class="empty-state">

                    <div class="empty-icon">
                        📦
                    </div>

                    <h3>
                        No orders found
                    </h3>

                    <p>
                        You don't have any orders matching your search.
                    </p>

                    <button
                        class="shop-btn"
                        onclick="goBack()"
                    >
                        Continue Shopping
                    </button>

                </div>
            `;

            return;

        }


        let html = `

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>Order ID</th>

                            <th>Date</th>

                            <th>Product</th>

                            <th>Price</th>

                            <th>Qty</th>

                            <th>Total</th>

                            <th>Payment</th>

                            <th>Status</th>

                            <th>Tracking</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody>
        `;


        filteredOrders.forEach(order => {

            const status =
                order.status || "pending";


            const orderNumber =
                order.order_number ||
                order.id;


            const date =
                formatDate(order.created_at);


            const price =
                formatMoney(order.price);


            const total =
                formatMoney(
                    order.total_price
                );


            const quantity =
                order.buying_quantity || 1;


            const tracking =
                order.tracking_number;


            html += `

                <tr>

                    <td>

                        <div class="order-number">
                            ${escapeHtml(orderNumber)}
                        </div>

                    </td>


                    <td>

                        <div class="date-text">
                            ${date}
                        </div>

                    </td>


                    <td>

                        <div class="product-name">
                            ${escapeHtml(
                                order.product_name ||
                                "Product"
                            )}
                        </div>

                    </td>


                    <td>

                        <div class="money">
                            ${price}
                        </div>

                    </td>


                    <td>

                        <div class="quantity">
                            ${quantity}
                        </div>

                    </td>


                    <td>

                        <div class="money">
                            ${total}
                        </div>

                    </td>


                    <td>

                        ${escapeHtml(
                            formatPaymentMode(
                                order.payment_mode
                            )
                        )}

                    </td>


                    <td>

                        <span class="status status-${escapeHtml(status)}">

                            ${escapeHtml(
                                formatStatus(status)
                            )}

                        </span>

                    </td>


                    <td>

                        ${
                            tracking
                            ? `
                                <div
                                    class="tracking"
                                    title="${escapeHtml(tracking)}"
                                >
                                    ${escapeHtml(tracking)}
                                </div>
                            `
                            : `
                                <span class="no-tracking">
                                    Not available
                                </span>
                            `
                        }

                    </td>


                    <td>

                        <button
                            class="track-btn"
                            onclick="openTracking('${escapeHtml(order.id)}')"
                        >
                            Track Order
                        </button>

                    </td>

                </tr>

            `;

        });


        html += `

                    </tbody>

                </table>

            </div>

        `;


        content.innerHTML = html;

    }


    /* =========================================================
       FILTER ORDERS
    ========================================================= */

    function filterOrders() {

        const search =
            document
                .getElementById("orderSearch")
                .value
                .trim()
                .toLowerCase();


        const status =
            document
                .getElementById("statusFilter")
                .value;


        filteredOrders =
            allOrders.filter(order => {

                const orderNumber =
                    String(
                        order.order_number ||
                        order.id ||
                        ""
                    ).toLowerCase();


                const productName =
                    String(
                        order.product_name ||
                        ""
                    ).toLowerCase();


                const tracking =
                    String(
                        order.tracking_number ||
                        ""
                    ).toLowerCase();


                const statusValue =
                    String(
                        order.status ||
                        "pending"
                    ).toLowerCase();


                const matchesSearch =
                    !search ||
                    orderNumber.includes(search) ||
                    productName.includes(search) ||
                    tracking.includes(search);


                const matchesStatus =
                    status === "all" ||
                    statusValue === status;


                return (
                    matchesSearch &&
                    matchesStatus
                );

            });


        renderOrders();

    }


    /* =========================================================
       OPEN TRACKING
    ========================================================= */

    function openTracking(orderId) {

        trackingOrder =
            allOrders.find(
                order => order.id === orderId
            );


        if (!trackingOrder) {

            showMessage(
                "Order not found.",
                "error"
            );

            return;

        }


        renderTrackingModal();


        document
            .getElementById("trackingModal")
            .classList.add("show");

    }


    /* =========================================================
       RENDER TRACKING MODAL
    ========================================================= */

    function renderTrackingModal() {

        const order =
            trackingOrder;


        const summary =
            document.getElementById(
                "trackingSummary"
            );


        const orderNumber =
            order.order_number ||
            order.id;


        summary.innerHTML = `

            <div class="summary-row">

                <span>
                    Order ID
                </span>

                <strong>
                    ${escapeHtml(orderNumber)}
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Product
                </span>

                <strong>
                    ${escapeHtml(
                        order.product_name ||
                        "Product"
                    )}
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Quantity
                </span>

                <strong>
                    ${escapeHtml(
                        String(
                            order.buying_quantity || 1
                        )
                    )}
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Total
                </span>

                <strong>
                    ${formatMoney(
                        order.total_price
                    )}
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Payment
                </span>

                <strong>
                    ${escapeHtml(
                        formatPaymentMode(
                            order.payment_mode
                        )
                    )}
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Tracking Number
                </span>

                <strong>
                    ${
                        order.tracking_number
                        ? escapeHtml(
                            order.tracking_number
                        )
                        : "Not assigned"
                    }
                </strong>

            </div>

        `;


        renderTimeline(order);

    }


    /* =========================================================
       ORDER TIMELINE
    ========================================================= */

    function renderTimeline(order) {

        const timeline =
            document.getElementById(
                "trackingTimeline"
            );


        const currentStatus =
            order.status || "pending";


        const steps = [

            {
                key: "pending",
                title: "Order Placed",
                description:
                    "Your order has been placed and is waiting for confirmation."
            },

            {
                key: "confirmed",
                title: "Order Confirmed",
                description:
                    "The seller has confirmed your order."
            },

            {
                key: "packed",
                title: "Order Packed",
                description:
                    "Your product has been packed and is ready for shipment."
            },

            {
                key: "shipped",
                title: "Order Shipped",
                description:
                    "Your order has been handed over for delivery."
            },

            {
                key: "out_for_delivery",
                title: "Out for Delivery",
                description:
                    "Your order is currently out for delivery."
            },

            {
                key: "delivered",
                title: "Delivered",
                description:
                    "Your order has been delivered successfully."
            }

        ];


        /* ================= CANCELLED ================= */

        if (currentStatus === "cancelled") {

            timeline.innerHTML = `

                <div class="timeline-item completed">

                    <div class="timeline-dot"></div>

                    <h4>
                        Order Placed
                    </h4>

                    <p>
                        Your order was created.
                    </p>

                </div>


                <div class="timeline-item cancelled">

                    <div class="timeline-dot"></div>

                    <h4>
                        Order Cancelled
                    </h4>

                    <p>
                        This order has been cancelled.
                    </p>

                </div>

            `;

            return;

        }


        const currentIndex =
            steps.findIndex(
                step =>
                    step.key === currentStatus
            );


        timeline.innerHTML =
            steps.map(
                (step, index) => {

                    let className =
                        "timeline-item";


                    if (
                        index < currentIndex
                    ) {

                        className +=
                            " completed";

                    } else if (
                        index === currentIndex
                    ) {

                        className +=
                            " active";

                    }


                    return `

                        <div
                            class="${className}"
                        >

                            <div class="timeline-dot"></div>

                            <h4>
                                ${escapeHtml(
                                    step.title
                                )}
                            </h4>

                            <p>
                                ${escapeHtml(
                                    step.description
                                )}
                            </p>

                        </div>

                    `;

                }
            )
            .join("");

    }


    /* =========================================================
       CLOSE TRACKING MODAL
    ========================================================= */

    function closeTrackingModal() {

        document
            .getElementById("trackingModal")
            .classList.remove("show");

        trackingOrder = null;

    }


    function closeTrackingOnOverlay(event) {

        if (
            event.target.id ===
            "trackingModal"
        ) {

            closeTrackingModal();

        }

    }


    /* =========================================================
       SEARCH
    ========================================================= */

    function searchOrders() {

        const input =
            document.getElementById(
                "orderSearch"
            );


        input.focus();


        input.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }


    /* =========================================================
       MENU
    ========================================================= */

    function openMenu() {

        const choice =
            prompt(
                "Enter page:\n\n" +
                "1 - Home\n" +
                "2 - My Orders\n" +
                "3 - Business Dashboard\n" +
                "4 - Products"
            );


        if (choice === "1") {

            window.location.href =
                "index.html";

        } else if (choice === "2") {

            window.location.href =
                "my-orders.html";

        } else if (choice === "3") {

            window.location.href =
                "business-user.html";

        } else if (choice === "4") {

            window.location.href =
                "product.html";

        }

    }


    /* =========================================================
       BACK / SHOPPING
    ========================================================= */

    function goBack() {

        window.location.href =
            "index.html";

    }


    /* =========================================================
       LOGOUT
    ========================================================= */

    async function logout() {

        try {

            const {
                error
            } = await supabaseClient.auth.signOut();


            if (error) {
                throw error;
            }


            window.location.href =
                "login.html";

        } catch (error) {

            console.error(
                "LOGOUT ERROR:",
                error
            );


            showMessage(
                error.message ||
                "Could not logout.",
                "error"
            );

        }

    }


    /* =========================================================
       FORMAT STATUS
    ========================================================= */

    function formatStatus(status) {

        if (!status) {
            return "Pending";
        }


        return status
            .replace(/_/g, " ")
            .replace(/\b\w/g, char =>
                char.toUpperCase()
            );

    }


    /* =========================================================
       FORMAT PAYMENT
    ========================================================= */

    function formatPaymentMode(payment) {

        if (!payment) {
            return "Pending";
        }


        return String(payment)
            .replace(/_/g, " ")
            .replace(/\b\w/g, char =>
                char.toUpperCase()
            );

    }


    /* =========================================================
       FORMAT MONEY
    ========================================================= */

    function formatMoney(value) {

        const number =
            Number(value || 0);


        return "₹" +
            number.toLocaleString(
                "en-IN",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );

    }


    /* =========================================================
       FORMAT DATE
    ========================================================= */

    function formatDate(value) {

        if (!value) {
            return "-";
        }


        const date =
            new Date(value);


        if (Number.isNaN(date.getTime())) {
            return "-";
        }


        return date.toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );

    }


    /* =========================================================
       ESCAPE HTML
    ========================================================= */

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================================================
       MESSAGE
    ========================================================= */

    let messageTimer = null;


    function showMessage(
        text,
        type = "success"
    ) {

        const message =
            document.getElementById(
                "message"
            );


        message.textContent =
            text;


        message.className =
            `message show ${type}`;


        clearTimeout(
            messageTimer
        );


        messageTimer =
            setTimeout(() => {

                message.className =
                    "message";

            }, 3500);

    }


    /* =========================================================
       ESC KEY
    ========================================================= */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape"
            ) {

                closeTrackingModal();

            }

        }
    );


    /* =========================================================
       INITIAL LOAD
       LOAD USER FUNCTION TO END CODE
    ========================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            loadUser();

        }
    );

</script>
