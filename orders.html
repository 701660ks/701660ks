<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>JS UNDEFINED — Orders</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f5f6fa;

    color: #171717;
}


/* =========================
   HEADER
========================= */

.header {

    height: 68px;

    background: #111827;

    color: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 28px;

    position: sticky;

    top: 0;

    z-index: 100;
}


.logo-area {

    display: flex;

    align-items: center;

    gap: 10px;
}


.logo-box {

    width: 34px;

    height: 34px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #5b35f5;

    border-radius: 8px;

    font-weight: 900;
}


.logo-text {

    font-size: 15px;

    font-weight: 900;
}


.logo-sub {

    display: block;

    font-size: 8px;

    color: #aaa;

    letter-spacing: .5px;

    margin-top: 2px;
}


.header-right {

    display: flex;

    align-items: center;

    gap: 8px;
}


.user-name {

    background: white;

    color: #222;

    padding: 8px 13px;

    border-radius: 8px;

    font-size: 12px;

    font-weight: bold;

    max-width: 160px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.header-btn {

    width: 36px;

    height: 36px;

    border: 1px solid #273449;

    background: #1b2638;

    color: white;

    border-radius: 8px;

    cursor: pointer;
}


.logout {

    background: #ef4444;

    border: none;

    color: white;

    padding: 10px 13px;

    border-radius: 8px;

    font-size: 12px;

    font-weight: bold;

    cursor: pointer;
}


/* =========================
   PAGE
========================= */

.container {

    max-width: 1400px;

    margin: auto;

    padding: 22px;
}


.back-link {

    display: inline-block;

    margin-bottom: 15px;

    color: #5b35f5;

    text-decoration: none;

    font-size: 12px;

    font-weight: bold;
}


/* =========================
   PAGE HEADER
========================= */

.page-header {

    background:
        linear-gradient(
            135deg,
            #172033,
            #253a68
        );

    color: white;

    padding: 26px;

    border-radius: 15px;

    margin-bottom: 20px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;
}


.page-header h1 {

    margin: 0 0 7px;

    font-size: 26px;
}


.page-header p {

    margin: 0;

    color: #cbd5e1;

    font-size: 13px;
}


.order-count {

    background:
        rgba(255,255,255,.12);

    border:
        1px solid
        rgba(255,255,255,.2);

    padding: 9px 13px;

    border-radius: 8px;

    font-size: 12px;

    font-weight: bold;

    white-space: nowrap;
}


/* =========================
   MESSAGE
========================= */

.message {

    display: none;

    padding: 13px 15px;

    border-radius: 9px;

    margin-bottom: 18px;

    font-size: 13px;

    font-weight: 600;
}


.message.success {

    display: block;

    background: #e8f8ed;

    color: #176b2b;
}


.message.error {

    display: block;

    background: #ffe9e9;

    color: #a00000;
}


/* =========================
   SEARCH / FILTER
========================= */

.toolbar {

    background: white;

    border: 1px solid #e7e7e7;

    border-radius: 14px;

    padding: 15px;

    margin-bottom: 18px;

    display: flex;

    gap: 10px;

    align-items: center;

    flex-wrap: wrap;
}


.search-wrap {

    flex: 1;

    min-width: 230px;

    position: relative;
}


.search-wrap input {

    width: 100%;

    padding: 12px 14px;

    border: 1px solid #ddd;

    border-radius: 8px;

    outline: none;

    font-size: 13px;
}


.search-wrap input:focus {

    border-color: #5b35f5;

    box-shadow:
        0 0 0 3px
        rgba(91,53,245,.08);
}


.filter-select {

    padding: 12px;

    border: 1px solid #ddd;

    border-radius: 8px;

    background: white;

    outline: none;

    font-size: 13px;
}


.refresh-btn {

    background: #111827;

    color: white;

    border: none;

    padding: 12px 15px;

    border-radius: 8px;

    font-size: 12px;

    font-weight: bold;

    cursor: pointer;
}


/* =========================
   ORDER CARD
========================= */

.orders-list {

    display: flex;

    flex-direction: column;

    gap: 14px;
}


.order-card {

    background: white;

    border: 1px solid #e5e5e5;

    border-radius: 14px;

    overflow: hidden;

    box-shadow:
        0 3px 14px
        rgba(0,0,0,.04);
}


.order-top {

    padding: 16px 18px;

    background: #fafafa;

    border-bottom: 1px solid #eee;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;
}


.order-number {

    font-size: 14px;

    font-weight: 800;
}


.order-date {

    color: #888;

    font-size: 11px;

    margin-top: 4px;
}


/* =========================
   STATUS
========================= */

.status {

    display: inline-block;

    padding: 6px 10px;

    border-radius: 20px;

    font-size: 10px;

    font-weight: bold;

    white-space: nowrap;
}


.status.pending {

    background: #fff3cd;

    color: #856404;
}


.status.confirmed {

    background: #e5f0ff;

    color: #0756a8;
}


.status.packed {

    background: #eee7ff;

    color: #5b28a8;
}


.status.shipped {

    background: #e4f7ff;

    color: #08708e;
}


.status.out_for_delivery {

    background: #fff0d9;

    color: #9a5800;
}


.status.delivered {

    background: #e5f8e9;

    color: #18752c;
}


.status.cancelled {

    background: #ffe5e5;

    color: #a40000;
}


/* =========================
   ORDER BODY
========================= */

.order-body {

    padding: 18px;
}


.order-grid {

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 15px;
}


.info-box {

    background: #fafafa;

    border-radius: 9px;

    padding: 12px;
}


.info-label {

    color: #888;

    font-size: 10px;

    margin-bottom: 5px;

    text-transform: uppercase;
}


.info-value {

    font-size: 13px;

    font-weight: 700;

    word-break: break-word;
}


/* =========================
   ORDER FOOTER
========================= */

.order-footer {

    padding: 14px 18px;

    border-top: 1px solid #eee;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    flex-wrap: wrap;
}


.tracking-number {

    font-size: 11px;

    color: #666;
}


.tracking-number strong {

    color: #222;
}


.order-actions {

    display: flex;

    gap: 8px;
}


.track-btn {

    border: none;

    background: #5b35f5;

    color: white;

    padding: 9px 14px;

    border-radius: 7px;

    font-size: 11px;

    font-weight: bold;

    cursor: pointer;
}


.track-btn:hover {

    background: #4c2de0;
}


/* =========================
   EMPTY
========================= */

.empty {

    background: white;

    border: 1px solid #e7e7e7;

    border-radius: 14px;

    padding: 55px 20px;

    text-align: center;

    color: #777;
}


.empty-icon {

    font-size: 38px;

    margin-bottom: 10px;
}


.empty-title {

    font-weight: bold;

    color: #444;

    margin-bottom: 5px;
}


.empty-text {

    font-size: 12px;
}


/* =========================
   MODAL
========================= */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.6);

    z-index: 500;

    align-items: center;

    justify-content: center;

    padding: 18px;
}


.modal-box {

    width: 100%;

    max-width: 600px;

    max-height: 92vh;

    overflow-y: auto;

    background: white;

    border-radius: 15px;

    padding: 22px;
}


.modal-head {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 20px;
}


.modal-title {

    font-size: 20px;

    font-weight: 800;
}


.close-btn {

    width: 32px;

    height: 32px;

    border: none;

    border-radius: 50%;

    background: #eee;

    cursor: pointer;

    font-size: 18px;
}


/* =========================
   TRACKING SUMMARY
========================= */

.track-summary {

    background: #f7f7f9;

    border-radius: 10px;

    padding: 14px;

    margin-bottom: 20px;
}


.track-summary-row {

    display: flex;

    justify-content: space-between;

    gap: 15px;

    padding: 6px 0;

    font-size: 12px;
}


.track-summary-label {

    color: #888;
}


.track-summary-value {

    font-weight: bold;

    text-align: right;

    word-break: break-word;
}


/* =========================
   STATUS UPDATE
========================= */

.update-box {

    background: #fafafa;

    border: 1px solid #eee;

    border-radius: 10px;

    padding: 15px;

    margin-bottom: 22px;
}


.update-box label {

    display: block;

    color: #555;

    font-size: 11px;

    font-weight: bold;

    margin-bottom: 7px;
}


.update-row {

    display: flex;

    gap: 8px;
}


.update-row select {

    flex: 1;

    padding: 11px;

    border: 1px solid #ddd;

    border-radius: 8px;

    background: white;

    outline: none;
}


.update-row button {

    background: #5b35f5;

    color: white;

    border: none;

    padding: 11px 16px;

    border-radius: 8px;

    font-weight: bold;

    font-size: 12px;

    cursor: pointer;
}


/* =========================
   TIMELINE
========================= */

.timeline {

    position: relative;

    margin-left: 8px;
}


.timeline::before {

    content: "";

    position: absolute;

    left: 8px;

    top: 8px;

    bottom: 8px;

    width: 2px;

    background: #ddd;
}


.timeline-item {

    position: relative;

    display: flex;

    gap: 15px;

    padding-bottom: 22px;
}


.timeline-dot {

    position: relative;

    z-index: 2;

    width: 18px;

    height: 18px;

    flex: 0 0 18px;

    border-radius: 50%;

    background: #ddd;

    border: 3px solid white;

    box-shadow:
        0 0 0 1px #ddd;
}


.timeline-dot.active {

    background: #5b35f5;

    box-shadow:
        0 0 0 1px #5b35f5;
}


.timeline-content {

    padding-top: 1px;
}


.timeline-title {

    font-size: 13px;

    font-weight: bold;
}


.timeline-text {

    color: #888;

    font-size: 10px;

    margin-top: 4px;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px) {

    .order-grid {

        grid-template-columns:
            repeat(2, 1fr);
    }

}


@media(max-width:700px) {

    .header {

        padding: 0 12px;
    }


    .container {

        padding: 13px;
    }


    .user-name {

        max-width: 90px;
    }


    .page-header {

        display: block;

        padding: 21px;
    }


    .order-count {

        display: inline-block;

        margin-top: 14px;
    }


    .order-grid {

        grid-template-columns: 1fr 1fr;
    }

}


@media(max-width:500px) {

    .header {

        height: 62px;
    }


    .logo-text {

        font-size: 13px;
    }


    .logo-sub {

        font-size: 7px;
    }


    .header-btn {

        width: 32px;

        height: 32px;
    }


    .logout {

        padding: 8px 10px;
    }


    .user-name {

        display: none;
    }


    .order-top {

        align-items: flex-start;

        flex-direction: column;
    }


    .order-grid {

        grid-template-columns: 1fr;
    }


    .order-footer {

        align-items: flex-start;

        flex-direction: column;
    }


    .order-actions {

        width: 100%;
    }


    .track-btn {

        width: 100%;
    }


    .update-row {

        flex-direction: column;
    }


    .update-row button {

        width: 100%;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">


    <div class="logo-area">


        <div class="logo-box">

            JS

        </div>


        <div>

            <div class="logo-text">

                JS UNDEFINED

            </div>


            <span class="logo-sub">

                BUSINESS PARTNER

            </span>

        </div>


    </div>


    <div class="header-right">


        <span
            id="userName"
            class="user-name">

            Loading...

        </span>


        <button
            class="header-btn"
            onclick="openSearch()"
            title="Search">

            🔎

        </button>


        <button
            class="header-btn"
            onclick="openMenu()"
            title="Menu">

            ☰

        </button>


        <button
            class="logout"
            onclick="logout()">

            Logout

        </button>


    </div>


</header>



<main class="container">


    <a
        href="business-user.html"
        class="back-link">

        ← Back to Business Dashboard

    </a>


    <!-- =========================
         PAGE HEADER
    ========================= -->

    <section class="page-header">


        <div>

            <h1>

                Orders

            </h1>


            <p>

                View customer orders, payment information
                and manage order tracking.

            </p>

        </div>


        <div
            id="orderCount"
            class="order-count">

            0 Orders

        </div>


    </section>


    <div
        id="message"
        class="message">
    </div>



    <!-- =========================
         SEARCH
    ========================= -->

    <section class="toolbar">


        <div class="search-wrap">

            <input
                id="searchInput"
                type="text"
                placeholder="Search order ID, user ID or product..."
                oninput="filterOrders()">

        </div>


        <select
            id="statusFilter"
            class="filter-select"
            onchange="filterOrders()">

            <option value="all">
                All Status
            </option>

            <option value="pending">
                Pending
            </option>

            <option value="confirmed">
                Confirmed
            </option>

            <option value="packed">
                Packed
            </option>

            <option value="shipped">
                Shipped
            </option>

            <option value="out_for_delivery">
                Out For Delivery
            </option>

            <option value="delivered">
                Delivered
            </option>

            <option value="cancelled">
                Cancelled
            </option>

        </select>


        <button
            class="refresh-btn"
            onclick="loadOrders()">

            ↻ Refresh

        </button>


    </section>



    <!-- =========================
         ORDERS
    ========================= -->

    <section
        id="ordersList"
        class="orders-list">

    </section>


</main>



<!-- =========================
     TRACK MODAL
========================= -->

<div
    id="trackModal"
    class="modal">


    <div class="modal-box">


        <div class="modal-head">


            <div class="modal-title">

                Track Order

            </div>


            <button
                class="close-btn"
                onclick="closeTrackModal()">

                ×

            </button>


        </div>



        <div
            id="trackSummary"
            class="track-summary">
        </div>



        <!-- UPDATE STATUS -->

        <div class="update-box">


            <label>

                Update Order Status

            </label>


            <div class="update-row">


                <select
                    id="orderStatus">


                    <option value="pending">

                        Pending

                    </option>


                    <option value="confirmed">

                        Confirmed

                    </option>


                    <option value="packed">

                        Packed

                    </option>


                    <option value="shipped">

                        Shipped

                    </option>


                    <option value="out_for_delivery">

                        Out For Delivery

                    </option>


                    <option value="delivered">

                        Delivered

                    </option>


                    <option value="cancelled">

                        Cancelled

                    </option>


                </select>


                <button
                    onclick="updateOrderStatus()">

                    Update

                </button>


            </div>


        </div>



        <!-- TRACKING -->

        <div class="modal-title"
             style="font-size:16px;margin-bottom:15px;">

            Order Timeline

        </div>


        <div
            id="timeline"
            class="timeline">

        </div>


    </div>

</div>



<script>


/* =========================
   VARIABLES
========================= */

let currentUser = null;

let currentOrders = [];

let filteredOrders = [];

let trackingOrderId = null;


/* =========================
   START
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadBusinessUser();

    }
);


/* =========================
   LOAD BUSINESS USER
========================= */

async function loadBusinessUser() {

    try {


        const {

            data: {
                user
            },

            error: userError

        } =
            await supabaseClient
                .auth
                .getUser();


        if (userError) {

            throw userError;

        }


        if (!user) {

            window.location.href =
                "index.html";

            return;

        }


        currentUser = user;



        /* PROFILE */

        const {

            data: profile,

            error: profileError

        } =
            await supabaseClient
                .from("profiles")
                .select(`
                    id,
                    full_name,
                    email,
                    user_type,
                    account_status
                `)
                .eq(
                    "id",
                    user.id
                )
                .single();


        if (profileError) {

            throw profileError;

        }


        /* BUSINESS CHECK */

        if (

            profile.user_type !== "b2b" &&

            profile.user_type !== "wholesaler"

        ) {

            alert(
                "Business account required."
            );

            window.location.href =
                "index.html";

            return;

        }


        /* STATUS CHECK */

        if (

            profile.account_status !==
                "approved" &&

            profile.account_status !==
                "active"

        ) {

            alert(
                "Your business account is not approved yet."
            );

            window.location.href =
                "index.html";

            return;

        }


        /* USER NAME */

        document
            .getElementById("userName")
            .textContent =

                profile.full_name ||

                profile.email ||

                user.email ||

                "Business User";


        /* LOAD ORDERS */

        await loadOrders();


    }
    catch(error) {


        console.error(
            "LOAD USER ERROR:",
            error
        );


        showMessage(

            error.message ||

            "Could not load business account.",

            "error"

        );

    }

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders() {

    try {


        const {

            data,

            error

        } =
            await supabaseClient

                .from("orders")

                .select("*")

                .eq(
                    "seller_id",
                    currentUser.id
                )

                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            throw error;

        }


        currentOrders =
            data || [];


        filteredOrders =
            [...currentOrders];


        document
            .getElementById("orderCount")
            .textContent =

                currentOrders.length +

                (
                    currentOrders.length === 1
                        ? " Order"
                        : " Orders"
                );


        renderOrders();


    }
    catch(error) {


        console.error(
            "LOAD ORDERS ERROR:",
            error
        );


        showMessage(

            error.message ||

            "Could not load orders.",

            "error"

        );


    }

}


/* =========================
   RENDER ORDERS
========================= */

function renderOrders() {


    const container =
        document.getElementById(
            "ordersList"
        );


    if (
        !filteredOrders.length
    ) {


        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🛒
                </div>

                <div class="empty-title">
                    No orders found
                </div>

                <div class="empty-text">
                    Customer orders for your products
                    will appear here.
                </div>

            </div>

        `;


        return;

    }



    container.innerHTML =

        filteredOrders
            .map(
                order =>
                    createOrderCard(order)
            )
            .join("");

}


/* =========================
   ORDER CARD
========================= */

function createOrderCard(order) {


    const orderId =
        order.order_number ||
        order.id ||
        "-";


    const createdDate =
        order.created_at
            ? new Date(
                order.created_at
            ).toLocaleString()
            : "-";


    const status =
        order.status ||
        "pending";


    const tracking =
        order.tracking_number ||
        "Not assigned";


    return `

        <article class="order-card">


            <div class="order-top">


                <div>

                    <div class="order-number">

                        ${escapeHtml(
                            orderId
                        )}

                    </div>


                    <div class="order-date">

                        ${escapeHtml(
                            createdDate
                        )}

                    </div>

                </div>


                <span
                    class="status ${escapeHtml(
                        status
                    )}">

                    ${formatStatus(
                        status
                    )}

                </span>


            </div>



            <div class="order-body">


                <div class="order-grid">


                    <div class="info-box">

                        <div class="info-label">
                            User ID
                        </div>

                        <div class="info-value">

                            ${escapeHtml(
                                order.user_id ||
                                "-"
                            )}

                        </div>

                    </div>


                    <div class="info-box">

                        <div class="info-label">
                            Product
                        </div>

                        <div class="info-value">

                            ${escapeHtml(
                                order.product_name ||
                                "-"
                            )}

                        </div>

                    </div>


                    <div class="info-box">

                        <div class="info-label">
                            Price
                        </div>

                        <div class="info-value">

                            ₹${Number(
                                order.price || 0
                            ).toFixed(2)}

                        </div>

                    </div>


                    <div class="info-box">

                        <div class="info-label">
                            Buying Quantity
                        </div>

                        <div class="info-value">

                            ${Number(
                                order.buying_quantity ||
                                0
                            )}

                        </div>

                    </div>


                    <div class="info-box">

                        <div class="info-label">
                            Total
                        </div>

                        <div class="info-value">

                            ₹${Number(
                                order.total_price ||
                                0
                            ).toFixed(2)}

                        </div>

                    </div>


                    <div class="info-box">

                        <div class="info-label">
                            Payment Mode
                        </div>

                        <div class="info-value">

                            ${escapeHtml(
                                order.payment_mode ||
                                "-"
                            )}

                        </div>

                    </div>


                    <div class="info-box">

                        <div class="info-label">
                            Product ID
                        </div>

                        <div class="info-value">

                            ${escapeHtml(
                                order.product_id ||
                                "-"
                            )}

                        </div>

                    </div>


                    <div class="info-box">

                        <div class="info-label">
                            Current Status
                        </div>

                        <div class="info-value">

                            ${formatStatus(
                                status
                            )}

                        </div>

                    </div>


                </div>

            </div>



            <div class="order-footer">


                <div class="tracking-number">

                    Tracking:

                    <strong>

                        ${escapeHtml(
                            tracking
                        )}

                    </strong>

                </div>


                <div class="order-actions">

                    <button
                        class="track-btn"
                        onclick="openTrackModal('${escapeHtml(
                            order.id
                        )}')">

                        📍 Track / Update

                    </button>

                </div>


            </div>


        </article>

    `;

}


/* =========================
   SEARCH / FILTER
========================= */

function filterOrders() {


    const search =

        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const status =

        document
            .getElementById(
                "statusFilter"
            )
            .value;


    filteredOrders =

        currentOrders.filter(
            order => {


                const orderNumber =

                    (
                        order.order_number ||
                        ""
                    )
                    .toLowerCase();


                const id =

                    (
                        order.id ||
                        ""
                    )
                    .toLowerCase();


                const userId =

                    (
                        order.user_id ||
                        ""
                    )
                    .toLowerCase();


                const product =

                    (
                        order.product_name ||
                        ""
                    )
                    .toLowerCase();


                const matchesSearch =

                    !search ||

                    orderNumber.includes(
                        search
                    ) ||

                    id.includes(
                        search
                    ) ||

                    userId.includes(
                        search
                    ) ||

                    product.includes(
                        search
                    );


                const matchesStatus =

                    status === "all" ||

                    order.status === status;


                return (
                    matchesSearch &&
                    matchesStatus
                );

            }
        );


    renderOrders();

}


/* =========================
   OPEN TRACK MODAL
========================= */

function openTrackModal(
    orderId
) {


    const order =

        currentOrders.find(
            item =>
                item.id === orderId
        );


    if (!order) {

        return;

    }


    trackingOrderId =
        orderId;


    document
        .getElementById(
            "trackModal"
        )
        .style.display =
            "flex";


    document
        .getElementById(
            "orderStatus"
        )
        .value =

            order.status ||
            "pending";


    renderTrackSummary(
        order
    );


    renderTimeline(
        order.status ||
        "pending"
    );

}

/* =========================
   TIMELINE
========================= */

function renderTimeline(
    currentStatus
) {


    const statuses = [

        {
            key: "pending",
            title: "Order Placed",
            text: "Order has been received."
        },

        {
            key: "confirmed",
            title: "Order Confirmed",
            text: "Seller confirmed the order."
        },

        {
            key: "packed",
            title: "Packed",
            text: "Product has been packed."
        },

        {
            key: "shipped",
            title: "Shipped",
            text: "Order has been handed to delivery."
        },

        {
            key: "out_for_delivery",
            title: "Out For Delivery",
            text: "Order is on the way to the customer."
        },

        {
            key: "delivered",
            title: "Delivered",
            text: "Order has been delivered."
        }

    ];


    const currentIndex =
        statuses.findIndex(
            item =>
                item.key ===
                currentStatus
        );


    const timeline =
        document.getElementById(
            "timeline"
        );


    if (
        currentStatus ===
        "cancelled"
    ) {


        timeline.innerHTML = `

            <div class="timeline-item">

                <div class="timeline-dot active"></div>

                <div class="timeline-content">

                    <div class="timeline-title">

                        Order Cancelled

                    </div>

                    <div class="timeline-text">

                        This order has been cancelled.

                    </div>

                </div>

            </div>

        `;


        return;

    }


    timeline.innerHTML =

        statuses
            .map(
                (item, index) => {

                    const active =
                        index <= currentIndex;


                    return `

                        <div
                            class="timeline-item">


                            <div
                                class="timeline-dot ${
                                    active
                                        ? "active"
                                        : ""
                                }">

                            </div>


                            <div
                                class="timeline-content">


                                <div
                                    class="timeline-title">

                                    ${item.title}

                                </div>


                                <div
                                    class="timeline-text">

                                    ${item.text}

                                </div>


                            </div>


                        </div>

                    `;

                }
            )
            .join("");

}


/* =========================
   UPDATE STATUS
========================= */

async function updateOrderStatus() {


    if (!trackingOrderId) {

        return;

    }


    const status =

        document
            .getElementById(
                "orderStatus"
            )
            .value;


    try {


        const {

            error

        } =
            await supabaseClient

                .from("orders")

                .update({

                    status:
                        status,

                    updated_at:
                        new Date()
                            .toISOString()

                })

                .eq(
                    "id",
                    trackingOrderId
                )

                .eq(
                    "seller_id",
                    currentUser.id
                );


        if (error) {

            throw error;

        }


        showMessage(
            "Order status updated successfully.",
            "success"
        );


        const order =

            currentOrders.find(
                item =>
                    item.id ===
                    trackingOrderId
            );


        if (order) {

            order.status =
                status;

        }


        renderOrders();


        renderTimeline(
            status
        );


        renderTrackSummary(
            order
        );


        document
            .getElementById(
                "orderStatus"
            )
            .value =
                status;


    }
    catch(error) {


        console.error(
            "UPDATE ORDER ERROR:",
            error
        );


        showMessage(

            error.message ||

            "Could not update order status.",

            "error"

        );

    }

}

   LOGOUT
========================= */

async function logout() {


    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "index.html";

}


/* =========================
   FORMAT STATUS
========================= */

function formatStatus(
    status
) {


    if (!status) {

        return "Pending";

    }


    return status

        .replaceAll(
            "_",
            " "
        )

        .replace(
            /\b\w/g,
            character =>
                character.toUpperCase()
        );

}


/* =========================
   MESSAGE
========================= */

function showMessage(
    message,
    type
) {


    const element =
        document.getElementById(
            "message"
        );


    element.textContent =
        message;


    element.className =
        "message " +
        type;


    setTimeout(
        function() {

            element.className =
                "message";

        },
        4500
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
    value
) {


    return String(
        value ?? ""
    )

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}
